<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0f1117; --surface:#181c27; --surface-2:#1e2333; --surface-3:#232a3b; --border:#262c3a; --border-2:#313849;
  --text:#e8eaf0; --text-2:#aab3c5; --muted:#7d879c;
  --accent:#f56231; --accent-2:#e8501a; --accent-bg:#372425;
  --good:#2ecc71; --warn:#f0c040; --bad:#e74c3c; --info:#3987e5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --radius:10px; --side:220px; --top:56px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--mono)}

/* ---------- top bar ---------- */
.topbar{position:fixed;inset:0 0 auto 0;height:var(--top);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 16px;z-index:40}
.brand{display:flex;align-items:center;gap:12px;min-width:calc(var(--side) - 16px)}
.brand img{height:40px;width:auto;display:block}
.brand .sep{width:1px;height:26px;background:var(--border-2)}
.brand .tag{font-size:11px;letter-spacing:.14em;color:var(--text-2);font-weight:600;text-transform:uppercase;white-space:nowrap}
.top-spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border-2);font-size:12px;color:var(--text-2);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(46,204,113,.15)}
.pill.warn .dot{background:var(--warn);box-shadow:0 0 0 3px rgba(240,192,64,.15)}
.pill.ok{color:var(--good)}
.pill.err .dot{background:var(--bad);box-shadow:0 0 0 3px rgba(231,76,60,.15)}
#gate{position:fixed;inset:0;background:radial-gradient(1200px 600px at 50% -10%,#2a1a17,var(--bg) 60%);display:none;align-items:center;justify-content:center;z-index:300;padding:16px;overflow:auto}
.gate-box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border-2);border-top:3px solid var(--accent-2);border-radius:14px;padding:28px 26px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.gate-box h2{margin:0 0 14px;font-size:19px}
.gate-box form{text-align:left;display:grid;gap:12px}
.gate-msg{font-size:12.5px;color:var(--text-2);background:var(--bg);border:1px solid var(--border-2);border-radius:8px;padding:9px 11px;margin-bottom:12px;text-align:left}
.gate-links{display:flex;justify-content:space-between;margin-top:16px;font-size:12.5px}
.gate-links a{color:var(--text-2);text-decoration:none} .gate-links a:hover{color:var(--accent)}
body.gated .topbar,body.gated .sidebar,body.gated main{visibility:hidden}
body.ro #quickAdd,body.ro .row-act,body.ro .page-h .btn.primary,body.ro [onclick*="importar"],body.ro [onclick*="editRow"],body.ro [onclick*="recorrencia"],body.ro [onclick*="autoConciliar"],body.ro #planoBox .right,body.ro [onclick*="saveCfg"],body.ro [onclick*="addOper"],body.ro .btn.danger,body.ro label.btn{display:none !important}
.period{display:flex;gap:6px;align-items:center}
.period select{height:30px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:8px;padding:0 8px;color:var(--text);font-family:var(--mono);font-size:12px}
.burger{display:none;background:none;border:0;font-size:20px;cursor:pointer;color:var(--text)}

/* ---------- sidebar ---------- */
.sidebar{position:fixed;top:var(--top);left:0;bottom:0;width:var(--side);background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:14px 8px 24px;z-index:30}
.nav-sec{font-size:10.5px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:18px 10px 6px;text-transform:uppercase}
.nav-sec:first-child{margin-top:4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text-2);text-decoration:none;font-weight:500;cursor:pointer;margin:1px 0}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.active{background:var(--accent-bg);color:var(--accent)}
.nav a .ic{width:20px;text-align:center;font-size:14px}
.nav a .lbl{flex:1;line-height:1.25}
.nav a .badge{background:var(--bad);color:#fff;border-radius:10px;font-size:10.5px;font-weight:700;padding:1px 7px;font-family:var(--mono)}
.nav a .badge.amber{background:#a0700a}

/* ---------- main ---------- */
main{margin-left:var(--side);padding:calc(var(--top) + 24px) 26px 60px;min-height:100%}
.page-h{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-h h1{font-size:23px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
.page-h p{margin:0;color:var(--text-2);max-width:780px}
.page-h p b{color:var(--text)}
.page-h .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface-2);color:var(--text);font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.btn.primary:hover{background:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:#ff8a80;border-color:#5a2a2a}
.btn.sm{height:26px;padding:0 9px;font-size:11.5px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* KPI cards (mirrors the pós-venda dashboard) */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--accent-2);border-radius:var(--radius);padding:15px 16px 14px;min-width:0}
.kpi.t-red{border-top-color:var(--bad)} .kpi.t-yellow{border-top-color:var(--warn)} .kpi.t-green{border-top-color:var(--good)} .kpi.t-blue{border-top-color:var(--info)} .kpi.t-gray{border-top-color:var(--border-2)}
.kpi .k-l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);font-weight:700}
.kpi .k-v{font-family:var(--mono);font-size:20px;font-weight:700;margin:8px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-s{font-size:11.5px;color:var(--muted)}
.delta{font-family:var(--mono);font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;margin-right:4px}
.delta.up{color:var(--good);background:rgba(46,204,113,.1)} .delta.down{color:var(--bad);background:rgba(231,76,60,.1)} .delta.flat{color:var(--muted);background:var(--surface-2)}

/* panels */
.grid{display:grid;gap:14px;margin-bottom:14px}
.g2{grid-template-columns:1.6fr 1fr} .g2e{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);min-width:0;overflow:hidden}
.panel.hot{border-color:#4a2a26;background:linear-gradient(180deg,#1c1a22, var(--surface) 60px)}
.panel-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel-h h3{margin:0;font-size:14px;font-weight:700}
.panel-h .sub{font-size:11.5px;color:var(--muted)}
.panel-h .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dotc{width:10px;height:10px;border-radius:50%;display:inline-block}
.panel-b{padding:14px 16px}
.chart-box{position:relative;height:280px}
.chart-box.tall{height:340px} .chart-box.short{height:220px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2);margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* tables */
.tbl-wrap{overflow:auto;max-height:620px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{position:sticky;top:0;background:var(--surface-2);color:var(--text-2);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;text-align:left;padding:10px 10px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:1}
thead th.sort{cursor:pointer;user-select:none}
thead th.sort:hover{color:var(--text)}
tbody td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:hover td{background:rgba(255,255,255,.02)}
td.num,th.num{text-align:right;font-family:var(--mono);white-space:nowrap}
th.num{font-family:var(--sans)}
tfoot td{position:sticky;bottom:0;background:var(--surface-2);font-weight:700;padding:10px 12px;border-top:1px solid var(--border-2)}
.empty{text-align:center;color:var(--muted);padding:44px 12px !important}
.row-act{display:flex;gap:4px;justify-content:flex-end;white-space:nowrap}
.icon-btn{background:transparent;border:1px solid transparent;border-radius:6px;width:25px;height:25px;padding:0;font-size:12px;cursor:pointer;color:var(--text-2)}
.icon-btn:hover{border-color:var(--border-2);color:var(--text);background:var(--surface-2)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;border:1px solid transparent}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.good{color:var(--good);background:rgba(46,204,113,.09);border-color:rgba(46,204,113,.25)}
.tag.warn{color:var(--warn);background:rgba(240,192,64,.08);border-color:rgba(240,192,64,.25)}
.tag.bad{color:#ff7b6e;background:rgba(231,76,60,.09);border-color:rgba(231,76,60,.3)}
.tag.info{color:#7fb2f0;background:rgba(57,135,229,.09);border-color:rgba(57,135,229,.28)}
.tag.neutral{color:var(--text-2);background:var(--surface-2);border-color:var(--border-2)}
.tag.neutral::before{display:none}
.muted{color:var(--muted)} .nowrap{white-space:nowrap} .t2{color:var(--text-2)}
.pos{color:var(--good)} .neg{color:#ff7b6e}

/* toolbar */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--border-2);background:transparent;color:var(--text-2);font-weight:600;font-size:12px;cursor:pointer}
.tab.on{background:var(--accent-bg);color:var(--accent);border-color:#5a3226}
.search{height:32px;min-width:220px;flex:1;max-width:340px;background:var(--bg);border:1px solid var(--border-2);border-radius:8px;padding:0 12px}
.toolbar select{height:32px;background:var(--bg);border:1px solid var(--border-2);border-radius:8px;padding:0 8px;max-width:220px}
.count{margin-left:auto;color:var(--muted);font-size:12px}

/* report tables */
.rep td,.rep th{white-space:nowrap}
.rep td:first-child,.rep th:first-child{position:sticky;left:0;background:var(--surface);z-index:2;min-width:250px;box-shadow:1px 0 0 var(--border)}
.rep td.num{font-size:12px}
.rep thead th:first-child{background:var(--surface-2);z-index:3}
.rep tr.sub td{font-weight:700;background:var(--surface-2)}
.rep tr.sub td:first-child{background:var(--surface-2)}
.rep tr.total td{font-weight:800;background:#241c1e;border-top:1px solid #5a3226}
.rep tr.total td:first-child{background:#241c1e;color:var(--accent)}
.rep tr.sec td{background:var(--bg);color:var(--muted);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding-top:14px}
.rep tr.sec td:first-child{background:var(--bg)}
.rep td.ind{padding-left:28px;color:var(--text-2)}
.rep .colsel{background:rgba(245,98,49,.06)}
.rep tr.pct td{color:var(--muted);font-size:11.5px}

/* insights */
.ins{list-style:none;margin:0;padding:0}
.ins li{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);align-items:flex-start}
.ins li:last-child{border-bottom:0}
.ins .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:14px}
.ins .bad .ico,.ins li.bad .ico{background:rgba(231,76,60,.14)} .ins li.warn .ico{background:rgba(240,192,64,.12)} .ins li.good .ico{background:rgba(46,204,113,.12)} .ins li.info .ico{background:rgba(57,135,229,.13)}
.ins b{display:block;font-size:13px;margin-bottom:2px}
.ins span{color:var(--text-2);font-size:12.5px}

/* progress / bars */
.prog{height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent-2);border-radius:5px}
.hbar{break-inside:avoid;display:grid;grid-template-columns:minmax(120px,1.1fr) 2fr auto;gap:10px;align-items:center;padding:6px 0;font-size:12.5px}
.hbar .bar{height:10px;background:var(--surface-3);border-radius:5px;overflow:hidden}
.hbar .bar i{display:block;height:100%;border-radius:5px}
.hbar .v{font-family:var(--mono);font-size:12px;text-align:right;white-space:nowrap}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(5,7,12,.72);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:6vh 16px;overflow:auto}
.overlay.on{display:flex}
.modal{background:var(--surface);border:1px solid var(--border-2);border-radius:14px;width:100%;max-width:680px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal.sm{max-width:440px} .modal.lg{max-width:960px}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:34px 16px;border:2px dashed var(--border-2);border-radius:12px;cursor:pointer;text-align:center;background:var(--bg)}
.drop:hover,.drop.on{border-color:var(--accent);background:#1c1416}
.imp{border:1px solid var(--border-2);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--bg)}
.imp.off{opacity:.45}
.imp-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.imp-meta{font-size:12px;color:var(--text-2);margin-bottom:8px;line-height:1.6}
.imp-meta b{color:var(--text)}
.imp-warn{font-size:12px;color:var(--warn);background:rgba(240,192,64,.07);border:1px solid rgba(240,192,64,.25);border-radius:8px;padding:7px 10px;margin:6px 0}
.imp-t select,.imp-t input{height:30px;background:var(--surface);border:1px solid var(--border-2);border-radius:6px;padding:0 6px;color:var(--text)}
.imp-sum{font-size:12.5px;color:var(--text-2);margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.imp-sum b{color:var(--text);font-family:var(--mono)}
.modal-h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-h h3{margin:0;font-size:16px}
.modal-h .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
.modal-b{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.modal-b .full{grid-column:1/-1}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border)}
.fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;height:36px;background:var(--bg);border:1px solid var(--border-2);border-radius:8px;padding:0 10px;color:var(--text)}
.fld textarea{height:70px;padding:8px 10px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.search:focus{outline:2px solid rgba(245,98,49,.45);border-color:var(--accent-2)}
.fld .hint{font-size:11px;color:var(--muted);margin-top:4px}
.calc{grid-column:1/-1;background:var(--bg);border:1px dashed var(--border-2);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--text-2)}
.calc b{color:var(--text);font-family:var(--mono)}
input[type=date]{color-scheme:dark}

/* toast */
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--surface-2);border:1px solid var(--border-2);border-left:3px solid var(--good);padding:10px 14px;border-radius:8px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:360px}
.toast.err{border-left-color:var(--bad)}

.note{font-size:12px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--border)}
.note b{color:var(--text-2)}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border-2);font-size:11px;color:var(--text-2);margin:2px}
.abc-A{color:var(--accent)} .abc-B{color:var(--warn)} .abc-C{color:var(--muted)}
.scrim{display:none}

@media (max-width:1100px){.g2,.g2e,.g3{grid-template-columns:1fr}}
@media (max-width:900px){
  :root{--side:250px}
  .burger{display:block}
  .brand{min-width:0}
  .brand .tag,.brand .sep,.hide-sm{display:none}
  .sidebar{transform:translateX(-100%);transition:transform .2s}
  body.menu .sidebar{transform:none}
  body.menu .scrim{display:block;position:fixed;inset:var(--top) 0 0 0;background:rgba(0,0,0,.5);z-index:25}
  main{margin-left:0;padding:calc(var(--top) + 16px) 16px 50px}
  .modal-b{grid-template-columns:1fr}
  .search{min-width:0;max-width:none}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:12px}
  .kpi .k-v{font-size:15px}
  .kpi .k-l{font-size:9.5px}
}
@media print{
  body{background:#fff;color:#111}
  .topbar,.sidebar,.actions,.toolbar,.row-act,.btn,.toasts,.no-print{display:none !important}
  main{margin:0;padding:0}
  .panel,.kpi{background:#fff;border-color:#ccc;break-inside:avoid}
  .kpi .k-l,.kpi .k-s,.page-h p,.muted,.t2{color:#444}
  thead th,tfoot td,.rep tr.sub td,.rep tr.total td,.rep td:first-child,.rep tr.sec td{background:#f1f1f1 !important;color:#111 !important}
  tbody td{border-color:#ddd}
  .tbl-wrap{max-height:none;overflow:visible}
  .chart-box{height:240px}
}
</style>
</head>
<body>

<script>
'use strict';
/* =====================================================================
   MASTER SPORTWEAR — Sistema Financeiro & Controladoria
   Base única que substitui as 16 planilhas de controle de 2025.
   ===================================================================== */

// ---------- constantes de negócio ----------
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES3 = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const PLANO = {
  vale_transporte:{n:'Vale-transporte',g:'pessoal'}, folha:{n:'Folha de pagamento',g:'pessoal'}, ferias:{n:'Férias',g:'pessoal'},
  decimo:{n:'13º salário',g:'pessoal'}, encargos:{n:'FGTS / INSS / encargos',g:'pessoal'}, rescisao:{n:'Verbas rescisórias',g:'pessoal'},
  diaristas:{n:'Diaristas',g:'pessoal'}, prolabore:{n:'Pró-labore (Diretoria)',g:'prolabore'},
  aluguel_conf:{n:'Aluguel confecção',g:'ocupacao'}, aluguel_loja:{n:'Aluguel loja',g:'ocupacao'}, iptu:{n:'IPTU',g:'ocupacao'},
  agua:{n:'Água e esgoto',g:'ocupacao'}, energia:{n:'Energia elétrica',g:'ocupacao'}, internet:{n:'Internet / telefonia',g:'ocupacao'},
  seguranca:{n:'Segurança / alarme',g:'ocupacao'}, sistemas:{n:'Sistemas e softwares',g:'admin'}, contabil:{n:'Sistema contábil / nuvem',g:'admin'},
  gerais:{n:'Despesas gerais',g:'admin'}, marketing:{n:'Marketing / tráfego pago',g:'comercial'}, impostos:{n:'Impostos (Simples Nacional)',g:'impostos'},
  acordos:{n:'Acordos e parcelamentos',g:'acordos'}, emprestimo:{n:'Empréstimos bancários',g:'financiamento'}, maquinas:{n:'Máquinas e equipamentos',g:'investimento'}
};
const GRUPOS = {pessoal:'Pessoal e encargos', prolabore:'Pró-labore (Diretoria)', ocupacao:'Ocupação e utilidades', admin:'Administrativas e sistemas',
  comercial:'Marketing', impostos:'Impostos sobre vendas', acordos:'Acordos e parcelamentos', financiamento:'Amortização de empréstimos', investimento:'Investimentos em máquinas'};
const COMPRAS = {tinta:{n:'Tinta',u:'L',pu:'R$/litro',q:'Litros'}, papel:{n:'Papel',u:'bobina',pu:'R$/bobina',q:'Bobinas'}, tecido:{n:'Tecido / malha',u:'kg',pu:'R$/kg',q:'Qtd (kg ou peça)'},
  aviamento:{n:'Aviamento',u:'un',pu:'R$/un',q:'Quantidade'}, bordado:{n:'Bordado',u:'peça',pu:'R$/peça',q:'Peças'}, varejo:{n:'Produtos de varejo',u:'un',pu:'R$/un',q:'Quantidade'}};
const LOGT = {envio:'Envio / frete interno', mototaxi:'Moto táxi', combustivel:'Combustível', estacionamento:'Estacionamento', correio:'Correios'};
const FORMAS = ['Pix','Dinheiro','Crédito','Débito','Boleto','Transferência'];
const PAL = ['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767']; // categórica validada (tema escuro)
const C = {rec:'#d95926', desp:'#3987e5', good:'#2ecc71', bad:'#e74c3c', warn:'#f0c040', text:'#e8eaf0', grid:'#232a38', muted:'#7d879c'};
const MOD_KEYS = ['compras','logistica','pagar','duplicatas','cartao','receitas','extrato'];

// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const NUM = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2});
const NUM2 = new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const money = v => BRL.format(+v || 0);
const moneyK = v => { const a = Math.abs(v); return (v<0?'-':'') + (a>=1e6 ? 'R$ '+NUM.format(+(a/1e6).toFixed(2))+' mi' : a>=1e3 ? 'R$ '+NUM.format(+(a/1e3).toFixed(1))+' mil' : BRL.format(a)); };
const num = v => (v===null||v===undefined||v==='') ? '' : NUM.format(v);
const pct = (v,d=1) => isFinite(v) ? (v*100).toFixed(d).replace('.',',')+'%' : '—';
const fdate = d => d ? d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4) : '';
const pad = n => String(n).padStart(2,'0');
const iso = dt => dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
const TODAY = iso(new Date());
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const days = (a,b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return iso(d); };
const addMonths = (s,n) => { const d = parseD(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); return iso(d); };
const eom = (y,m) => y+'-'+pad(m)+'-'+pad(new Date(y,m,0).getDate());
const sum = (a,f=x=>x) => a.reduce((s,x)=>s+(+f(x)||0),0);
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const r2 = v => Math.round((+v||0)*100)/100;
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

// ---------- estado / persistência ----------
const SEED = JSON.parse(document.getElementById('seed').textContent);
const MCFG = window.MASTER_CONFIG || {};
const ONLINE = !!(MCFG.supabaseUrl && MCFG.supabaseAnonKey && !/COLE_AQUI/.test(MCFG.supabaseUrl+MCFG.supabaseAnonKey));
const LS_KEY = 'masterSportwear.financeiro.v1';
function defaultCfg(){
  return { empresa:'Master Sportwear', saldoInicial:{}, prazoDup:15, metaReceita:130000, metaMargem:0.15,
    taxas:{ Stone:{debito:1.0, credito1:2.99, credito2_6:3.49, credito7_12:3.49, pix:1.99},
            Asaas:{debito:1.89, credito1:2.49, credito2_6:2.49, credito7_12:2.49, pix:1.99} } };
}
function normalize(d){
  d.db = d.db || {}; MOD_KEYS.forEach(k => d.db[k] = d.db[k] || []); d.db.pedidos = d.db.pedidos || []; d.db.banco = d.db.banco || [];
  d.db.duplicatas.forEach(r => { if (!Array.isArray(r.pagamentos)){ const v = r2((+r.recebido||0)+(+r.freteReceb||0)); r.pagamentos = v>0 ? [{id:'pg'+r.id, data:r.dataReceb||r.entrega, valor:v, forma:r.forma||'', obs:'Migrado da planilha'}] : []; } delete r.recebido; delete r.freteReceb; delete r.dataReceb; if (r.forma!==undefined && !r.pagamentos.length) delete r.forma; });
  const def = defaultCfg(); d.cfg = Object.assign(def, d.cfg || {}); d.cfg.taxas = Object.assign(def.taxas, d.cfg.taxas || {});
  d.cfg.saldoInicial = Object.assign({}, SEED.cfg.saldoInicial, d.cfg.saldoInicial || {});
  d.hist = d.hist || SEED.hist || null;
  Object.values(d.db).forEach(arr => arr.forEach(r => { if (!r.id) r.id = r.os && arr === d.db.pedidos ? 'os'+r.os : uid('x'); }));
  return d;
}
let storageOK = true;
function load(){
  if (ONLINE) return normalize({db:{}, cfg:{}});
  try { const raw = localStorage.getItem(LS_KEY); if (raw) return normalize(JSON.parse(raw)); } catch(e){ storageOK = false; }
  return normalize(JSON.parse(JSON.stringify(SEED)));
}
let S = load();
function save(){
  if (typeof applyPlano==='function') applyPlano();
  if (S.db.banco && S.db.banco.length && typeof movimentos==='function'){ const ok = new Set(movimentos().map(m=>m.key)); S.db.banco.forEach(b => { if (b.links){ b.links = b.links.filter(k=>ok.has(k)); if (!b.links.length){ b.links = null; b.modo = null; } } }); }
  if (ONLINE){ if (typeof cloudSchedule==='function') cloudSchedule(); }
  else { try { localStorage.setItem(LS_KEY, JSON.stringify({db:S.db, cfg:S.cfg, hist:S.hist})); storageOK = true; } catch(e){ storageOK = false; } }
  savePill(); badges();
}
function savePill(){
  const p = $('#savePill');
  if (ONLINE){ if (typeof cloudPill==='function') cloudPill(); return; }
  p.className = 'pill hide-sm' + (storageOK ? '' : ' warn');
  p.innerHTML = `<span class="dot"></span><span>${storageOK ? 'Dados salvos neste navegador' : 'Sem armazenamento — faça backup'}</span>`;
}

// ---------- período global ----------
function yearsAvailable(){
  const ys = new Set([new Date().getFullYear()]);
  const add = d => { if (d) ys.add(+d.slice(0,4)); };
  S.db.compras.forEach(r=>add(r.data)); S.db.pagar.forEach(r=>add(r.venc)); S.db.duplicatas.forEach(r=>add(r.entrega)); S.db.receitas.forEach(r=>add(r.data));
  return [...ys].sort();
}
function hasData(y){ return S.db.pagar.some(r=>r.venc&&+r.venc.slice(0,4)===y) || S.db.duplicatas.some(r=>+r.entrega.slice(0,4)===y) || S.db.compras.some(r=>+r.data.slice(0,4)===y); }
const UI = { view:'dashboard', year: null, month: 0, tab:{}, q:{}, f:{}, sort:{} };
function initPeriod(){
  const cy = new Date().getFullYear(); const withData = yearsAvailable().filter(hasData);
  UI.year = hasData(cy) ? cy : (withData.length ? Math.max(...withData) : cy);
  try { const s = JSON.parse(localStorage.getItem(LS_KEY+'.ui')||'null'); if (s && s.year) { UI.year = s.year; UI.month = s.month||0; UI.view = s.view||UI.view; } } catch(e){}
}

function persistUI(){ try { localStorage.setItem(LS_KEY+'.ui', JSON.stringify({year:UI.year, month:UI.month, view:UI.view})); } catch(e){} }
const inYear = (d, y=UI.year) => d && +d.slice(0,4) === y;
const inPeriod = d => d && +d.slice(0,4) === UI.year && (!UI.month || +d.slice(5,7) === UI.month);
const periodLabel = () => UI.month ? `${MESES[UI.month-1]}/${UI.year}` : `Ano ${UI.year}`;
function monthly(rows, dateF, valF, filt, year=UI.year){
  const a = Array(12).fill(0);
  for (const r of rows){ if (filt && !filt(r)) continue; const d = typeof dateF==='function' ? dateF(r) : r[dateF]; if (!d || +d.slice(0,4)!==year) continue; a[+d.slice(5,7)-1] += +valF(r) || 0; }
  return a;
}
const pick = arr => UI.month ? arr[UI.month-1] : sum(arr);

// ---------- regras de cálculo ----------
const dupTotal = r => (+r.valor||0) + (+r.frete||0);
const dupPgs = r => r.pagamentos || [];
const dupRec = r => r2(sum(dupPgs(r), p=>p.valor));
const dupUltRec = r => dupPgs(r).reduce((m,p)=>p.data>m?p.data:m,'') || null;
const pmrDe = rows => { let w=0, t=0; rows.forEach(r=>dupPgs(r).forEach(p=>{ if (p.data){ const d = days(r.entrega,p.data); if (d>=0){ w += d*p.valor; t += p.valor; } } })); return t ? w/t : 0; };
const dupSaldo = r => { const s = r2(dupTotal(r) - dupRec(r)); return s < 1 ? 0 : s; }; // diferenças de centavos = quitada
function dupStatus(r){ const s = dupSaldo(r); if (s <= 0.01) return 'Recebido'; return dupRec(r) > 0 ? 'Parcial' : 'Em aberto'; }
const dupAging = r => dupSaldo(r) > 0.01 ? Math.max(0, days(r.entrega, TODAY)) : 0;
const cpEfetivo = r => r.status==='pago' ? r2((+r.valorPago||0) - (+r.juros||0) - (+r.multa||0)) : (+r.valor||0);
function cpStatus(r){
  if (r.status==='pago') return 'Pago';
  const dd = days(TODAY, r.venc);
  if (dd < 0) return 'Vencido'; if (dd === 0) return 'Vence hoje'; if (dd <= 7) return 'Próx. 7 dias'; return 'A vencer';
}
const cardTaxaValor = r => r2((+r.valor||0) - (+r.liquido||0));
function taxaSugerida(oper, forma, parc){
  const t = S.cfg.taxas[oper] || S.cfg.taxas.Stone; const f = norm(forma);
  if (f.startsWith('deb')) return t.debito; if (f==='pix') return t.pix;
  parc = +parc || 1; return parc<=1 ? t.credito1 : parc<=6 ? t.credito2_6 : t.credito7_12;
}
function cardDatas(r){
  const n = +r.parcelas || 1; if (norm(r.forma).startsWith('deb') || norm(r.forma)==='pix') return [addDays(r.data,1)];
  return Array.from({length:n}, (_,i) => addMonths(r.data, i+1));
}
const tagFor = s => ({'Recebido':'good','Pago':'good','Parcial':'warn','Em aberto':'info','A vencer':'info','Próx. 7 dias':'warn','Vence hoje':'warn','Vencido':'bad'}[s] || 'neutral');

// ---------- DRE ----------
function computeDRE(year){
  const db = S.db, m = (rows,d,v,f) => monthly(rows,d,v,f,year);
  const cpBy = f => m(db.pagar, 'venc', cpEfetivo, r => f(r));
  const L = {};
  L.vendas = m(db.receitas,'data',r=>r.valor-(+r.frete||0), r=>r.tipo==='venda');
  L.duplic = m(db.duplicatas,'entrega',r=>r.valor);
  L.fretes = add(m(db.duplicatas,'entrega',r=>r.frete), m(db.receitas,'data',r=>+r.frete||0, r=>r.tipo==='venda'));
  L.outras = m(db.receitas,'data',r=>r.valor, r=>r.tipo!=='venda');
  L.receita = add(L.vendas,L.duplic,L.fretes,L.outras);
  L.impostos = cpBy(r => (PLANO[r.categoria]||{}).g==='impostos');
  L.taxas = m(db.cartao,'data',cardTaxaValor);
  L.deducoes = add(L.impostos,L.taxas);
  L.liquida = sub(L.receita,L.deducoes);
  L.cmvCat = {}; Object.keys(COMPRAS).forEach(k => L.cmvCat[k] = m(db.compras,'data',r=>r.total, r=>r.cat===k));
  L.cmv = add(...Object.values(L.cmvCat));
  L.bruto = sub(L.liquida,L.cmv);
  L.logCat = {}; Object.keys(LOGT).forEach(k => L.logCat[k] = m(db.logistica,'data',r=>r.valor, r=>r.tipo===k));
  L.logist = add(...Object.values(L.logCat));
  L.mc = sub(L.bruto,L.logist);
  L.fixCat = {}; ['pessoal','prolabore','ocupacao','admin','comercial','acordos'].forEach(g => L.fixCat[g] = cpBy(r => (PLANO[r.categoria]||{}).g===g));
  L.fixas = add(...Object.values(L.fixCat));
  L.ebitda = sub(L.mc,L.fixas);
  L.financ = m(db.pagar,'venc',r=>(+r.juros||0)+(+r.multa||0), r=>r.status==='pago');
  L.resultado = sub(L.ebitda,L.financ);
  L.emprest = cpBy(r => (PLANO[r.categoria]||{}).g==='financiamento');
  L.invest = cpBy(r => (PLANO[r.categoria]||{}).g==='investimento');
  L.posInv = sub(L.resultado, add(L.emprest,L.invest));
  return L;
}
function add(...arrs){ return Array.from({length:12},(_,i)=>sum(arrs,a=>a[i])); }
function sub(a,b){ return a.map((v,i)=>v-b[i]); }

// ---------- Fluxo de caixa (regime de caixa) ----------
function computeFC(year){
  const db = S.db, m = (rows,d,v,f) => monthly(rows,d,v,f,year);
  const F = {};
  F.vendas = m(db.receitas,'data',r=>r.valor, r=>r.tipo==='venda' && !r.cartaoId);
  F.cartao = Array(12).fill(0); db.cartao.filter(r=>r.vinculado).forEach(r=>(r.datas||[]).forEach(d=>{ if (+d.slice(0,4)===year) F.cartao[+d.slice(5,7)-1] += (r.liquido||0)/(r.datas.length||1); }));
  const dpg = db.duplicatas.flatMap(r=>dupPgs(r).filter(p=>!p.cartaoId));
  F.duplic = m(dpg,'data',p=>p.valor);
  F.outras = m(db.receitas,'data',r=>r.valor, r=>r.tipo!=='venda');
  F.entradas = add(F.vendas,F.cartao,F.duplic,F.outras);
  F.insumos = m(db.compras,'data',r=>r.total);
  F.logist = m(db.logistica,'data',r=>r.valor);
  const pg = g => m(db.pagar,'dataPg',r=>r.valorPago, r=>r.status==='pago' && (Array.isArray(g)?g:[g]).includes((PLANO[r.categoria]||{}).g));
  F.pessoal = pg(['pessoal','prolabore']); F.ocup = pg('ocupacao'); F.admin = pg(['admin','comercial']); F.impostos = pg(['impostos','acordos']);
  F.emprest = pg('financiamento'); F.invest = pg('investimento');
  F.saidas = add(F.insumos,F.logist,F.pessoal,F.ocup,F.admin,F.impostos,F.emprest,F.invest);
  F.geracao = sub(F.entradas,F.saidas);
  let si = saldoInicial(year); F.ini = []; F.fim = [];
  for (let i=0;i<12;i++){ F.ini[i] = si; si = si + F.geracao[i]; F.fim[i] = si; }
  return F;
}
function saldoInicial(year){
  const v = S.cfg.saldoInicial[year];
  if (v !== undefined && v !== null && v !== '') return +v;
  if (hasData(year-1)) return computeFC(year-1).fim[11];
  return 0;
}

function delta(cur, prev, invert=false){

        out.push(kpi('Preço médio',q.length?money(pm):'—',`${u.pu} · ponderado pela quantidade`,'t-yellow'), kpi('Volume comprado',q.length?num(sum(q,r=>r.qtd))+' '+u.u:'—', cat==='tecido'?'somente compras em kg':'','t-green')); }
      else { const d = computeDRE(UI.year); const rec = pick(d.receita); out.push(kpi('Insumos / receita bruta',pct(t/(rec||1)),`receita do período ${moneyK(rec)}`,'t-yellow')); }

  logistica: {

      {k:'qtd',l:'Nº de corridas / qtd',t:'num'},{k:'origem',l:'Origem (de)',t:'text',list:()=>[...new Set(S.db.logistica.map(r=>r.origem).filter(Boolean))]},{k:'destino',l:'Destino (para)',t:'text',list:()=>[...new Set(S.db.logistica.map(r=>r.destino).filter(Boolean))]},
      {k:'valor',l:'Valor (R$)',t:'money',req:1},{k:'obs',l:'Observação / OS',t:'text'}],

    defaults:()=>({data:TODAY,tipo:UI.tab.logistica&&UI.tab.logistica!=='all'?UI.tab.logistica:'envio',qtd:1}),
    kpis(rows){ const t=sum(rows,r=>r.valor); const d=computeDRE(UI.year); const rec=pick(d.receita);
      return [kpi('Gasto com logística', kmoney(t),`${rows.length} lançamento(s)`,'t-blue'),kpi('Custo médio por lançamento', kmoney(t/(rows.length||1)),'','t-gray'),kpi('Logística / receita',pct(t/(rec||1),2),'peso da entrega sobre o faturamento','t-yellow')]; },

    fields:[{k:'data',l:'Data do pagamento',t:'date',req:1},{k:'fornecedor',l:'Favorecido',t:'text',req:1,list:()=>[...new Set(S.db.extrato.map(r=>r.fornecedor))]},{k:'descricao',l:'Descrição',t:'text'},
      {k:'categoria',l:'Categoria',t:'text',list:()=>[...new Set(S.db.extrato.map(r=>r.categoria))],req:1},{k:'valor',l:'Valor (R$)',t:'money',req:1},{k:'fonte',l:'Fonte de pagamento',t:'text',list:()=>[...new Set(S.db.extrato.map(r=>r.fonte))]}],
    cols:[{k:'data',l:'Data',f:fdate},{k:'fornecedor',l:'Favorecido'},{k:'descricao',l:'Descrição',cls:'t2'},{k:'categoria',l:'Categoria',r:r=>`<span class="tag neutral">${esc(r.categoria)}</span>`},{k:'valor',l:'Valor',num:1,f:money,tot:1},{k:'fonte',l:'Fonte',cls:'muted nowrap'}],

    defaults:()=>({data:TODAY,fonte:'PIX STONE'}),

      return [kpi('Total pago', kmoney(t),`${rows.length} pagamento(s)`,'t-blue'),kpi('Retiradas dos sócios', kmoney(s),pct(s/(t||1))+' das saídas','t-red'),kpi('Gastos operacionais', kmoney(t-s),'','t-green'),kpi('Maior pagamento', kmoney(Math.max(0,...rows.map(r=>r.valor))),'','t-gray')]; },

function modRows(key, opts={}){
  const M = MODS[key]; let rows = S.db[key].filter(r => inPeriod(r[M.dateKey]));
  const tab = UI.tab[key];
  if (M.tabKey && tab && tab!=='all') rows = rows.filter(r => r[M.tabKey]===tab);
  if (opts.noFilters) return rows;
  const fl = UI.f[key] || {};
  (M.filters||[]).forEach(f => { const v = fl[f.k]; if (v) rows = rows.filter(r => f.fn ? f.fn(r,v) : String(r[f.k])===v); });
  const q = norm(UI.q[key]); if (q) rows = rows.filter(r => norm(Object.values(r).join(' ')+' '+(M.cols.map(c=>c.v?c.v(r):'').join(' '))).includes(q));
  return rows;
}
const optsOf = o => (typeof o==='function' ? o() : o).map(x => typeof x==='object' ? x : {v:x,l:x});

function renderModule(key){
  const M = MODS[key];
  const base = modRows(key, {noFilters:true}), rows = modRows(key);
  const sortS = UI.sort[key] || {k:M.dateKey, d:-1};
  const col = M.cols.find(c=>c.k===sortS.k) || {k:sortS.k};
  const val = r => col.v ? col.v(r) : r[col.k];
  rows.sort((a,b) => { const x = val(a), y = val(b); return (x>y?1:x<y?-1:0) * sortS.d; });
  const tabs = M.tabs ? `<div class="tabs">${[['all','Todos']].concat(Object.entries(M.tabs).map(([k,o])=>[k,o.n])).map(([k,l])=>`<button class="tab ${(UI.tab[key]||'all')===k?'on':''}" onclick="setTab('${key}','${k}')">${l}</button>`).join('')}</div>` : '';
  const fl = UI.f[key] || {};
  const filters = (M.filters||[]).map(f => `<select onchange="setFilter('${key}','${f.k}',this.value)"><option value="">${f.l}: todos</option>${optsOf(f.o).map(o=>`<option value="${esc(o.v)}" ${fl[f.k]===String(o.v)?'selected':''}>${esc(o.l)}</option>`).join('')}</select>`).join('');
  const tot = M.cols.map(c => c.tot ? sum(rows, r => c.v ? c.v(r) : r[c.k]) : null);
  const body = rows.length ? rows.map(r => `<tr>${M.cols.map(c => { const v = c.v ? c.v(r) : r[c.k]; const html = c.r ? c.r(r) : c.f ? c.f(v, r) : esc(v); return `<td class="${c.num?'num':''} ${c.cls||''}">${html}</td>`; }).join('')}
      <td><div class="row-act">${(M.actions||[]).filter(a=>a.show(r)).map((a,i)=>`<button class="icon-btn" title="${a.t}" onclick="rowAction('${key}','${r.id}',${M.actions.indexOf(a)})">${a.i}</button>`).join('')}
      <button class="icon-btn" title="Editar" onclick="editRow('${key}','${r.id}')">✎</button><button class="icon-btn" title="Duplicar" onclick="dupRow('${key}','${r.id}')">⧉</button><button class="icon-btn" title="Excluir" onclick="delRow('${key}','${r.id}')">🗑</button></div></td></tr>`).join('')
    : `<tr><td class="empty" colspan="${M.cols.length+1}">Nenhum lançamento em ${periodLabel()}${UI.q[key]||Object.values(fl).some(Boolean)?' com esses filtros':''}. Use “＋ ${M.novo||'Nova'} ${M.single}” para registrar.</td></tr>`;
  const foot = rows.length ? `<tfoot><tr>${M.cols.map((c,i)=>`<td class="${c.num?'num':''}">${i===0?'Total':tot[i]!==null?money(tot[i]):''}</td>`).join('')}<td></td></tr></tfoot>` : '';
  const sortIcon = c => sortS.k===c.k ? (sortS.d>0?' ▲':' ▼') : '';
  $('#view').innerHTML = pageHead(`${M.title}`, M.sub, `${M.extraActions?M.extraActions():''}<button class="btn" onclick="exportModule('${key}')">⬇ Excel</button><button class="btn" onclick="window.print()">🖨 Imprimir</button><button class="btn primary" onclick="editRow('${key}')">＋ ${M.novo||'Nova'} ${M.single}</button>`)
    + `<div class="kpis">${[].concat(M.kpis(rows)).join('')}</div>`
    + `<div class="grid g2"><div class="panel"><div class="panel-h"><h3 id="mcT"></h3><span class="sub" id="mcS"></span></div><div class="panel-b"><div id="mcL"></div><div class="chart-box short"><canvas id="mc"></canvas></div></div></div>
       <div class="panel"><div class="panel-h"><h3 id="msT"></h3><span class="sub">${periodLabel()}</span></div><div class="panel-b" id="msB"></div></div></div>`
    + `<div class="panel"><div class="toolbar">${tabs}<input class="search" placeholder="Buscar (fornecedor, OS, descrição…)" value="${esc(UI.q[key]||'')}" oninput="setQ('${key}',this.value)" id="q_${key}">${filters}<span class="count">${rows.length} de ${base.length} registro(s) · ${periodLabel()}</span></div>
       <div class="tbl-wrap"><table id="tbl"><thead><tr>${M.cols.map(c=>`<th class="sort ${c.num?'num':''}" onclick="setSort('${key}','${c.k}')">${c.l}${sortIcon(c)}</th>`).join('')}<th></th></tr></thead><tbody>${body}</tbody>${foot}</table></div></div>`;
  moduleCharts(key, rows);
}

function moduleCharts(key, rows){
  const M = MODS[key]; const T = (t,s) => { $('#mcT').textContent = t; $('#mcS').textContent = s||''; };
  const side = (t, html) => { $('#msT').textContent = t; $('#msB').innerHTML = html; };
  const filtTab = r => !M.tabKey || !UI.tab[key] || UI.tab[key]==='all' || r[M.tabKey]===UI.tab[key];
  const top = (arr, kf, vf, n=8) => { const m = {}; arr.forEach(r => { const k = kf(r) || '(não informado)'; m[k] = (m[k]||0) + (+vf(r)||0); }); return Object.entries(m).map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v).slice(0,n); };
  if (M.chart === 'mensal' || M.chart === 'categorias'){
    const vf = key==='receitas'||key==='extrato'||key==='logistica' ? r=>r.valor : r=>r.total;
    const data = monthly(S.db[key], M.dateKey, vf, filtTab);
    T('Evolução mensal', `${UI.year} · destaque no mês selecionado`);
    chart('mc', {type:'bar', data:{labels:MES3, datasets:[barDs('Valor', data, data.map((_,i)=>!UI.month||UI.month===i+1?C.rec:'#5a3226'))]}, options:{scales:{y:yMoney,x:xCat}}});
    if (key==='logistica') side('Por tipo / prestador', hbars(top(rows, r=>UI.tab.logistica&&UI.tab.logistica!=='all' ? r.prestador : LOGT[r.tipo], r=>r.valor), C.desp));
    else if (key==='extrato') side('Por categoria', hbars(top(rows, r=>r.categoria, r=>r.valor, 10), C.desp));
    else { const ped = S.db.pedidos.filter(p=>inPeriod(p.data));
      if (ped.length){ const tp = sum(ped,p=>p.total); side('Pedidos importados (OS)', `<div class="muted" style="font-size:11.5px;margin-bottom:6px">${ped.length} OS · ${money(tp)} · ticket médio ${money(tp/ped.length)} · ${num(sum(ped,p=>p.pecas))} peças</div><div class="t2" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:8px 0 2px">Por canal</div>${hbars(top(ped,p=>p.canal||'Não informado',p=>p.total,5),C.rec)}<div class="t2" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:10px 0 2px">Por vendedor(a)</div>${hbars(top(ped,p=>p.vendedor||'Não informado',p=>p.total,5),C.desp)}`); }
      else side('Composição', hbars(top(rows, r=>r.tipo==='venda'?'Vendas':'Outras receitas', r=>r.valor), C.desp)); }
  }
  if (M.chart === 'aging'){
    const ab = S.db.duplicatas.filter(r => dupSaldo(r)>0.01);
    const b = [['Até 15 dias',0,15],['16–30 dias',16,30],['31–60 dias',31,60],['61–90 dias',61,90],['+90 dias',91,1e9]].map(([l,a,z])=>({l, v:sum(ab.filter(r=>dupAging(r)>=a&&dupAging(r)<=z), dupSaldo)}));
    T('Faturado × recebido por mês', `${UI.year} · data de entrega`);
    $('#mcL').innerHTML = legendHTML([[C.desp,'Faturado'],[C.rec,'Recebido']]);
    chart('mc', {type:'bar', data:{labels:MES3, datasets:[barDs('Faturado', monthly(S.db.duplicatas,'entrega',dupTotal), C.desp), barDs('Recebido', monthly(S.db.duplicatas,'entrega',dupRec), C.rec)]}, options:{scales:{y:yMoney,x:xCat}}});
    $('#msT').textContent = 'Envelhecimento do saldo em aberto'; $('#msB').innerHTML = `<div class="muted" style="font-size:11.5px;margin-bottom:6px">Todas as duplicatas com saldo, por dias desde a entrega</div>` + hbars(b.map((x,i)=>({...x, c:['#2ecc71','#c98500','#d95926','#e66767','#e74c3c'][i]})), C.rec)
      + `<div style="margin-top:12px;font-size:12px" class="t2">Maiores saldos: ${ab.sort((a,b)=>dupSaldo(b)-dupSaldo(a)).slice(0,5).map(r=>`<span class="chip">OS ${esc(r.os)} · ${money(dupSaldo(r))}</span>`).join('')||'—'}</div>`;
  }
  if (M.chart === 'agenda'){
    const ag = Array(12).fill(0); S.db.cartao.forEach(r => (r.datas||[]).forEach(d => { if (inYear(d)) ag[+d.slice(5,7)-1] += (r.liquido||0)/(r.datas.length||1); }));
    T('Agenda de recebíveis (líquido)', `${UI.year} · quando cada parcela cai na conta`);
    chart('mc', {type:'bar', data:{labels:MES3, datasets:[barDs('Previsto na conta', ag, ag.map((_,i)=>{ const ym = UI.year+'-'+pad(i+1); return ym < TODAY.slice(0,7) ? '#5a3226' : C.rec; }))]}, options:{scales:{y:yMoney,x:xCat}}});
    $('#mcL').innerHTML = legendHTML([['#5a3226','Já liquidado'],[C.rec,'A receber']]);
    const byParc = top(rows, r => r.forma==='Crédito' ? (r.parcelas>1?`Crédito ${r.parcelas}x`:'Crédito à vista') : r.forma, r=>r.valor);
    const t = S.cfg.taxas;
    side('Mix de pagamento no cartão', hbars(byParc, C.desp) + `<div style="margin-top:12px" class="muted">Tabela de taxas: ${Object.entries(t).map(([k,v])=>`<span class="chip">${k}: déb ${v.debito}% · créd ${v.credito1}% · 2–6x ${v.credito2_6}%</span>`).join('')}</div>`);
  }
  if (M.chart === 'grupos'){
    const base = S.db.pagar; const gs = [['Pessoal e encargos',['pessoal']],['Pró-labore',['prolabore']],['Ocupação e utilidades',['ocupacao']],['Administrativas e sistemas',['admin']],['Marketing',['comercial']],['Impostos e acordos',['impostos','acordos']],['Máquinas',['investimento']],['Empréstimos',['financiamento']]];
    const ds = gs.map(([l,g],i)=>barDs(l, monthly(base,'venc',cpEfetivo,r=>g.includes((PLANO[r.categoria]||{}).g)), PAL[i], {stack:'s', borderRadius:2, borderColor:'#181c27', borderWidth:{top:1}})).filter(d=>sum(d.data)>0);
    T('Despesas por grupo, mês a mês', `${UI.year} · competência (vencimento)`);
    $('#mcL').innerHTML = legendHTML(ds.map(d=>[d.backgroundColor,d.label]));
    chart('mc', {type:'bar', data:{labels:MES3, datasets:ds}, options:{scales:{y:{...yMoney,stacked:true},x:{...xCat,stacked:true}}}});
    side('Maiores contas do período', hbars(top(rows, r=>(PLANO[r.categoria]||{}).n||r.categoria, cpEfetivo, 9), C.desp));
  }
  if (M.chart === 'compras'){
    const cat = UI.tab.compras;
    if (cat && cat!=='all'){
      const u = COMPRAS[cat]; const q = monthly(S.db.compras,'data',r=>r.qtd,r=>r.cat===cat&&+r.qtd&&(cat!=='tecido'||r.unid==='kg')); const v = monthly(S.db.compras,'data',r=>r.total,r=>r.cat===cat&&+r.qtd&&(cat!=='tecido'||r.unid==='kg'));
      const pm = q.map((x,i)=>x?r2(v[i]/x):null);
      T(`Preço médio de ${u.n.toLowerCase()} (${u.pu})`, `${UI.year} · acompanhe reajustes de fornecedor`);
      chart('mc', {type:'line', data:{labels:MES3, datasets:[{label:u.pu, data:pm, borderColor:C.rec, backgroundColor:C.rec, borderWidth:2, pointRadius:4, pointHoverRadius:6, spanGaps:true, tension:.25}]}, options:{scales:{y:{...yMoney, beginAtZero:false},x:xCat}}});
    } else {
      const ds = Object.keys(COMPRAS).map((k,i)=>barDs(COMPRAS[k].n, monthly(S.db.compras,'data',r=>r.total,r=>r.cat===k), PAL[i], {stack:'s', borderRadius:2, borderColor:'#181c27', borderWidth:{top:1}})).filter(d=>sum(d.data)>0);
      T('Compras por insumo, mês a mês', `${UI.year}`); $('#mcL').innerHTML = legendHTML(ds.map(d=>[d.backgroundColor,d.label]));
      chart('mc', {type:'bar', data:{labels:MES3, datasets:ds}, options:{scales:{y:{...yMoney,stacked:true},x:{...xCat,stacked:true}}}});
    }
    const tf = top(rows, r=>r.fornecedor, r=>r.total, 8); const tt = sum(rows,r=>r.total);
    side('Fornecedores (concentração)', hbars(tf, C.desp, tt) + (tf[0] && tt ? `<div class="note" style="margin:10px -16px -14px">${tf[0].v/tt>0.5?'⚠️ ':''}<b>${esc(tf[0].l)}</b> concentra ${pct(tf[0].v/tt,0)} das compras deste filtro.</div>` : ''));
  }
}

// ---------- ações do CRUD ----------
window.setTab = (k,t) => { UI.tab[k] = t; UI.f[k] = {}; render(); };
window.setFilter = (k,f,v) => { UI.f[k] = UI.f[k]||{}; UI.f[k][f] = v; render(); };
let qTimer; window.setQ = (k,v) => { UI.q[k] = v; clearTimeout(qTimer); qTimer = setTimeout(()=>{ render(); const el = $('#q_'+k); if (el){ el.focus(); el.setSelectionRange(v.length,v.length); } }, 220); };
window.setSort = (k,c) => { const s = UI.sort[k]; UI.sort[k] = {k:c, d: s && s.k===c ? -s.d : (c===MODS[k].dateKey?-1:1)}; render(); };
window.rowAction = (k,id,i) => { const r = S.db[k].find(x=>x.id===id); if (r) MODS[k].actions[i].run(r); };
window.delRow = (k,id) => { const r = S.db[k].find(x=>x.id===id); confirmBox('Excluir lançamento', `Excluir este registro de <b>${MODS[k].title}</b>?${k==='receitas'&&r&&r.cartaoId?' A venda no cartão vinculada a este sinal também será excluída.':''} Esta ação não pode ser desfeita (a não ser restaurando um backup).`, 'Excluir', () => { S.db[k] = S.db[k].filter(x=>x.id!==id); if (k==='receitas' && r && r.cartaoId) S.db.cartao = S.db.cartao.filter(c=>c.id!==r.cartaoId); if (k==='duplicatas' && r){ const ks = (r.pagamentos||[]).map(p=>p.cartaoId).filter(Boolean); S.db.cartao = S.db.cartao.filter(c=>!ks.includes(c.id)); } save(); toast('Lançamento excluído.'); render(); }); };
window.dupRow = (k,id) => { const r = S.db[k].find(x=>x.id===id); if (!r) return; const c = JSON.parse(JSON.stringify(r)); delete c.id; delete c.cartaoId; if (k==='duplicatas') c.pagamentos = []; editRow(k, null, c); };
window.editRow = (k, id, preset) => {
  const M = MODS[k]; const cur = id ? S.db[k].find(x=>x.id===id) : null; const r = cur ? {...cur} : {...M.defaults(), ...(preset||{})};
  const lists = []; const field = f => {
    const v = r[f.k] ?? ''; const req = f.req ? ' required' : ''; let input;
    if (f.t==='select') input = `<select id="f_${f.k}"${req}>${optsOf(f.o).map(o=>`<option value="${esc(o.v)}" ${String(v)===String(o.v)?'selected':''}>${esc(o.l)}</option>`).join('')}</select>`;
    else if (f.t==='textarea') input = `<textarea id="f_${f.k}">${esc(v)}</textarea>`;
    else { const type = f.t==='date'?'date':(f.t==='money'||f.t==='num')?'number':'text'; const step = f.t==='money'?' step="0.01"':f.t==='num'?' step="any"':'';
      let list = ''; if (f.list){ list = ` list="dl_${f.k}"`; lists.push(`<datalist id="dl_${f.k}">${f.list().slice(0,400).map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`); }
      input = `<input id="f_${f.k}" type="${type}"${step}${req}${list} value="${esc(v)}" ${f.t==='money'?'inputmode="decimal"':''}>`; }
    return `<div class="fld ${f.full?'full':''}"><label for="f_${f.k}">${f.l}${f.req?' *':''}</label>${input}${f.hint?`<div class="hint">${f.hint}</div>`:''}</div>`;
  };

function topFornecedores(){
  const m = {}; const addF = (k,v) => { k = (k||'').trim().toUpperCase().replace(/\s+/g,' '); if (!k || k==='DESPESAS GERAIS' || k==='FOLHA DE PAGAMENTO' || k==='DIRETORIA') return; m[k] = (m[k]||0) + (+v||0); };
  S.db.compras.filter(r=>inPeriod(r.data)).forEach(r=>addF(r.fornecedor||(COMPRAS[r.cat]?.n+' (fornecedor não informado)'), r.total));
  S.db.pagar.filter(r=>inPeriod(r.venc)).forEach(r=>addF(r.fornecedor, cpEfetivo(r)));
  S.db.logistica.filter(r=>inPeriod(r.data)).forEach(r=>addF(r.prestador||LOGT[r.tipo], r.valor));
  return Object.entries(m).map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v);
}
function insights(d, f){
  const out = []; const rec = pick(d.receita), res = pick(d.resultado), mg = res/(rec||1);
  const venc = S.db.pagar.filter(r=>cpStatus(r)==='Vencido');
  if (venc.length) out.push({t:'bad',i:'⛔',h:`${venc.length} conta(s) vencida(s) — ${money(sum(venc,r=>r.valor))}`,s:`Mais antiga: ${esc(venc.sort((a,b)=>a.venc<b.venc?-1:1)[0].fornecedor)} (${fdate(venc[0].venc)}). Regularize para evitar juros e multa.`});
  const ab30 = S.db.duplicatas.filter(r=>dupSaldo(r)>0.01 && dupAging(r)>30);
  if (ab30.length) out.push({t:'warn',i:'⏳',h:`${money(sum(ab30,dupSaldo))} em duplicatas com +30 dias`,s:`${ab30.length} OS entregues e não pagas. Priorize a cobrança das maiores: ${ab30.sort((a,b)=>dupSaldo(b)-dupSaldo(a)).slice(0,3).map(r=>'OS '+esc(r.os)).join(', ')}.`});
  if (rec) out.push(res<0 ? {t:'bad',i:'📉',h:`Prejuízo de ${money(-res)} em ${periodLabel()}`,s:`Margem líquida ${pct(mg)}. Revise o peso dos insumos (${pct(pick(d.cmv)/rec)}) e das despesas fixas (${pct(pick(d.fixas)/rec)}).`}
    : mg < S.cfg.metaMargem ? {t:'warn',i:'🎯',h:`Margem líquida de ${pct(mg)}, abaixo da meta de ${pct(S.cfg.metaMargem,0)}`,s:`Resultado de ${money(res)} sobre receita de ${money(rec)}.`} : {t:'good',i:'✅',h:`Margem líquida de ${pct(mg)} — acima da meta`,s:`Resultado de ${money(res)} em ${periodLabel()}.`});
  const neg = d.resultado.map((v,i)=>({v,i})).filter(x=>x.v<0 && (d.receita[x.i]||d.cmv[x.i]));
  if (!UI.month && neg.length) out.push({t:'warn',i:'🗓',h:`${neg.length} mês(es) com resultado negativo em ${UI.year}`,s:neg.map(x=>`${MES3[x.i]} (${moneyK(x.v)})`).join(' · ')});
  // ponto de equilíbrio
  const mesesComDados = d.receita.filter(v=>v>0).length || 1; const mcPct = sum(d.mc)/(sum(d.receita)||1); const fixMed = sum(d.fixas)/mesesComDados; const pe = mcPct>0 ? fixMed/mcPct : 0;
  if (pe) out.push({t:'info',i:'⚖️',h:`Ponto de equilíbrio: ${money(pe)} por mês`,s:`Com margem de contribuição de ${pct(mcPct)} e despesas fixas médias de ${money(fixMed)}. Receita média mensal: ${money(sum(d.receita)/mesesComDados)}.`});
  // preço tinta / papel
  ['tinta','papel'].forEach(cat => {
    const rows = S.db.compras.filter(r=>r.cat===cat&&inYear(r.data)&&+r.preco).sort((a,b)=>a.data<b.data?-1:1); if (rows.length<2) return;
    const cnt = {}; rows.forEach(r=>cnt[r.item]=(cnt[r.item]||0)+1); const item = Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0];
    const it = rows.filter(r=>r.item===item); if (it.length<2) return; const a = it[0].preco, b = it[it.length-1].preco; const v = (b-a)/a;
    if (Math.abs(v)>0.03) out.push({t:v>0?'warn':'good',i:v>0?'🔺':'🔻',h:`${COMPRAS[cat].n}: preço ${v>0?'subiu':'caiu'} ${pct(Math.abs(v))} em ${UI.year}`,s:`${esc(item)}: de ${money(a)} para ${money(b)} ${COMPRAS[cat].pu.replace('R$','')}. ${v>0?'Vale renegociar ou cotar outro fornecedor.':''}`});
  });
  // concentração tecido
  const tec = S.db.compras.filter(r=>r.cat==='tecido'&&inPeriod(r.data)); const tt = sum(tec,r=>r.total);
  if (tt){ const m = {}; tec.forEach(r=>m[r.fornecedor]=(m[r.fornecedor]||0)+r.total); const [fn,fv] = Object.entries(m).sort((a,b)=>b[1]-a[1])[0]; if (fv/tt>0.5) out.push({t:'info',i:'🧵',h:`${pct(fv/tt,0)} do tecido vem de ${esc(fn)}`,s:'Alta dependência de um fornecedor: negocie volume e mantenha uma segunda opção homologada.'}); }
  // taxas cartão
  const cc = S.db.cartao.filter(r=>inPeriod(r.data)); const cb = sum(cc,r=>r.valor); if (cb) out.push({t:'info',i:'💳',h:`Taxas de cartão: ${money(sum(cc,cardTaxaValor))} (${pct(sum(cc,cardTaxaValor)/cb,2)} efetivo)`,s:`Sobre ${money(cb)} vendidos no cartão. Estimular Pix no sinal reduz esse custo.`});
  const pl = pick(d.fixCat.prolabore); if (pl && rec) out.push({t:'info',i:'👤',h:`Pró-labore: ${pct(pl/rec)} da receita`,s:`${money(pl)} em ${periodLabel()}.`});
  if (!out.length) out.push({t:'good',i:'👍',h:'Nenhum alerta no período',s:'Lance as movimentações para que o painel gere análises.'});
  return out.slice(0,7);
}

/* =====================================================================
   IMPORTAÇÃO DA ORDEM DE SERVIÇO (PDF do GestãoClick)
   Lê o PDF, monta a prévia e, após confirmação, lança:
   - sinal / pagamento no ato  -> Vendas & Entradas
   - pagamento no cartão        -> Cartões & Recebíveis (taxa e parcelas)
   - saldo / frete a receber    -> Duplicatas a Receber
   ===================================================================== */
const PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdfjsReady = null;
function loadPdfJs(){
  if (pdfjsReady) return pdfjsReady;
  pdfjsReady = new Promise((ok, fail) => {
    if (window.pdfjsLib) return ok(window.pdfjsLib);
    const s = document.createElement('script'); s.src = PDFJS_URL;
    s.onload = async () => {
      const lib = window.pdfjsLib;
      try { const t = await (await fetch(PDFJS_WORKER)).text(); lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], {type:'text/javascript'})); }
      catch(e){ lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; }
      ok(lib);
    };
    s.onerror = () => { pdfjsReady = null; fail(new Error('Não foi possível carregar o leitor de PDF (verifique a internet).')); };
    document.head.appendChild(s);
  });
  return pdfjsReady;
}
// Reconstrói as linhas do PDF; colunas distantes ficam separadas por 2+ espaços
async function pdfLines(file){
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  const lines = [];
  for (let p = 1; p <= doc.numPages; p++){
    const items = (await (await doc.getPage(p)).getTextContent()).items.filter(i => i.str && i.str.trim());
    const rows = [];
    items.forEach(i => { const y = i.transform[5], x = i.transform[4]; let r = rows.find(r => Math.abs(r.y - y) < 2.5); if (!r){ r = {y, it:[]}; rows.push(r); } r.it.push({x, w:i.width, s:i.str}); });
    rows.sort((a,b) => b.y - a.y).forEach(r => {
      r.it.sort((a,b) => a.x - b.x); let txt = '', end = null;
      r.it.forEach(i => { if (end !== null){ const gap = i.x - end; txt += gap > 8 ? '   ' : gap > 0.6 ? ' ' : ''; } txt += i.s; end = i.x + i.w; });
      lines.push(txt.replace(/ /g,' ').trimEnd());
    });
    if (lines.some(l => /OBSERVA[ÇC][ÕO]ES|CONTRATO DE PRESTA/i.test(l))) break; // o contrato não interessa
  }
  return lines;
}
const brNum = s => { if (s===undefined||s===null) return 0; s = String(s).replace(/[^\d,.-]/g,''); if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); return +s || 0; };
const brDate = s => { const m = String(s||'').match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : null; };
const cap = s => { s = String(s||'').trim(); if (/[a-zà-ú]/.test(s)) return s; return s.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase()).replace(/ (De|Da|Do|Dos|Das|E) /g, m => m.toLowerCase()); };
function formaOS(f){
  const n = norm(f);
  if (n.includes('credito')) return 'Crédito'; if (n.includes('debito')) return 'Débito'; if (n.includes('pix')) return 'Pix';
  if (n.includes('dinheiro') || n.includes('especie')) return 'Dinheiro'; if (n.includes('boleto')) return 'Boleto';
  if (n.includes('transfer') || n.includes('deposito') || n.includes('ted')) return 'Transferência'; if (n.includes('duplicata')) return 'Duplicata';
  return cap(f) || 'Pix';
}
function parseOS(lines, fileName){
  const all = lines.join('\n'); const get = (re, i=1) => { const m = all.match(re); return m ? m[i].trim() : ''; };
  const o = { arquivo:fileName, os:get(/PEDIDO\s*N[ºo°.]*\s*(\d+)/i), data:null, vendedor:get(/Vendedor:\s*([^\n]+)/i), prazo:brDate(get(/PRAZO DE ENTREGA:\s*(\d{2}\/\d{2}\/\d{4})/i)),
    canal:get(/ACHOU A LOJA\s*\?\s*:?\s*(.*?)(?:\s{2,}|\s*DATA DO|\n|$)/i), cliente:get(/Cliente:\s*(.*?)(?:\s{2,}|\s*CNPJ|\n|$)/i),
    cidade:get(/Cidade:\s*(.*?)(?:\s{2,}|\s*Estado|\n|$)/i), uf:get(/Estado:\s*([A-Z]{2})/), itens:[], pagamentos:[], avisos:[] };
  const pl = lines.find(l => /PEDIDO\s*N/i.test(l)); o.data = brDate(pl) || brDate(all.match(/\d{2}\/\d{2}\/\d{4}/)?.[0]);
  o.produtos = brNum(get(/PRODUTOS:\s*([\d.,]+)/i)); o.frete = brNum(get(/FRETE:\s*([\d.,]+)/i)); o.desconto = brNum(get(/DESCONTO:\s*([\d.,]+)/i));
  o.servicos = brNum(get(/SERVI[ÇC]OS:\s*([\d.,]+)/i)); o.total = brNum(get(/TOTAL:\s*R\$\s*([\d.,]+)/i)) || (o.produtos + o.servicos + o.frete - o.desconto);
  // itens
  let i0 = lines.findIndex(l => /ITEM\s+NOME/i.test(l));
  if (i0 >= 0) for (let i = i0+1; i < lines.length; i++){
    const l = lines[i].trim(); if (/^TOTAL\b/i.test(l) || /PRODUTOS:/i.test(l)) break;
    const p = l.split(/\s{2,}/); if (p.length >= 5 && /^\d+$/.test(p[0])) { const n = p.length; o.itens.push({nome:p.slice(1, n-4).join(' ') || p[1], und:p[n-4], qtd:brNum(p[n-3]), unit:brNum(p[n-2]), sub:brNum(p[n-1])}); }
    else if (p.length >= 4 && /^\d+\s/.test(p[0])) { const m = p[0].match(/^(\d+)\s+(.*)$/); const n = p.length; o.itens.push({nome:m[2], und:p[n-4]||'', qtd:brNum(p[n-3]), unit:brNum(p[n-2]), sub:brNum(p[n-1])}); }
  }
  o.pecas = sum(o.itens, x => x.qtd);
  // pagamentos
  i0 = lines.findIndex(l => /VENCIMENTO/i.test(l) && /FORMA/i.test(l));
  if (i0 >= 0) for (let i = i0+1; i < lines.length; i++){
    const l = lines[i].trim(); if (!l) continue; if (/^(TRANSPORTADORA|OBSERVA|DADOS|CONTRATO)/i.test(l)) break;
    const m = l.match(/^(\d{2}\/\d{2}\/\d{4})\s+([\d.]*\d,\d{2})\s+(.*)$/); if (!m) continue;
    const resto = m[3].split(/\s{2,}/); let forma = resto[0], obs = resto.slice(1).join(' ');
    if (resto.length === 1){ const k = m[3].match(/^(CART[ÃA]O\s+(?:DE\s+)?(?:CR[ÉE]DITO|D[ÉE]BITO)|PIX|DINHEIRO|DUPLICATA|BOLETO(?:\s+BANC[ÁA]RIO)?|TRANSFER[ÊE]NCIA(?:\s+BANC[ÁA]RIA)?|DEP[ÓO]SITO)\s*(.*)$/i); if (k){ forma = k[1]; obs = k[2]; } }
    o.pagamentos.push({venc:brDate(m[1]), valor:brNum(m[2]), formaTxt:forma.trim(), forma:formaOS(forma), obs:obs.trim()});
  }
  o.transp = (() => { const k = lines.findIndex(l => /^\s*TRANSPORTADORA/i.test(l)); return k >= 0 ? (lines[k+1]||'').trim() : ''; })();
  // classificação sugerida
  o.pagamentos.forEach(p => {
    const noAto = p.venc && o.data && p.venc <= o.data;
    p.parcelas = Math.max(1, +((p.obs.match(/(\d+)\s*x/i)||[])[1] || 1));
    p.destino = p.forma === 'Duplicata' ? 'duplicata' : noAto ? 'sinal' : 'duplicata';
    p.operadora = Object.keys(S.cfg.taxas)[0] || 'Stone';
  });
  if (!o.os) o.avisos.push('Número do pedido não encontrado.');
  if (!o.pagamentos.length) o.avisos.push('Nenhuma linha em “Dados do pagamento”.');
  const sp = sum(o.pagamentos, p => p.valor); if (o.total && Math.abs(sp - o.total) > 0.05) o.avisos.push(`Soma dos pagamentos (${money(sp)}) difere do total do pedido (${money(o.total)}).`);
  o.existente = osJaLancada(o.os);
  return o;
}
function osJaLancada(os){
  if (!os) return 0; const k = String(os);
  return S.db.receitas.filter(r=>r.osRef===k).length + S.db.duplicatas.filter(r=>String(r.os)===k).length + S.db.cartao.filter(r=>String(r.os)===k).length;
}

const DEST = {sinal:'Sinal / pago no ato', duplicata:'Duplicata a receber', ignorar:'Não lançar'};
function alocarFrete(o){ // frete vem do resumo do pedido (FRETE:), não da observação do pagamento
  o.pagamentos.forEach(p => p.freteParte = 0); let rest = o.frete || 0;
  ['duplicata','sinal'].forEach(dest => o.pagamentos.filter(p=>p.destino===dest).sort((a,b)=>a.venc<b.venc?1:-1).forEach(p => { const f = Math.min(rest, p.valor); p.freteParte = r2(f); rest = r2(rest - f); }));
  o.freteSobra = rest;
}
function previewImport(){
  IMP.forEach(o => { if (!o.erro) alocarFrete(o); });
  const card = (o, oi) => {
    if (o.erro) return `<div class="imp"><div class="imp-h"><b>${esc(o.arquivo)}</b><span class="tag bad">Erro</span></div><div class="muted">${esc(o.erro)}</div></div>`;

      const tx = isCard && p.destino==='sinal' ? taxaSugerida(p.operadora, p.forma, p.parcelas) : null;
      return `<tr><td>${fdate(p.venc)}</td><td class="num">${money(p.valor)}</td><td>${esc(p.formaTxt)}${p.obs?`<div class="muted" style="font-size:11px">${esc(p.obs)}</div>`:''}</td>
        <td><select onchange="IMP[${oi}].pagamentos[${pi}].destino=this.value;previewImport()">${Object.entries(DEST).map(([k,l])=>`<option value="${k}" ${p.destino===k?'selected':''}>${l}</option>`).join('')}</select></td>

const TOL_DIAS = 3;
// Todos os movimentos do sistema que passam pelo banco
function movimentos(){
  const L = [], db = S.db;
  db.receitas.forEach(r => { if (!r.cartaoId) L.push({key:'r:'+r.id, data:r.data, valor:+r.valor, tipo:r.tipo==='venda'?'Venda / sinal':'Outra receita', desc:r.descricao, mod:'receitas'}); });
  db.duplicatas.forEach(d => (d.pagamentos||[]).forEach(p => { if (!p.cartaoId) L.push({key:`dp:${d.id}:${p.id}`, data:p.data, valor:+p.valor, tipo:'Recebimento de duplicata', desc:`OS ${d.os}${d.cliente?' · '+d.cliente:''}${p.forma?' · '+p.forma:''}`, mod:'duplicatas'}); }));
  db.cartao.forEach(c => (c.datas||[]).forEach((dt,i) => L.push({key:`kp:${c.id}:${i}`, data:dt, valor:r2((c.liquido||0)/(c.datas.length||1)), tipo:'Repasse de cartão', desc:`${c.operadora} · OS ${c.os||'—'} · parcela ${i+1}/${c.datas.length}`, mod:'cartao'})));
  db.pagar.forEach(p => { if (p.status==='pago' && p.dataPg) L.push({key:'p:'+p.id, data:p.dataPg, valor:-(+p.valorPago||0), tipo:'Conta paga', desc:`${p.fornecedor} · ${p.descricao}`, mod:'pagar'}); });
  db.compras.forEach(c => L.push({key:'c:'+c.id, data:c.data, valor:-(+c.total||0), tipo:'Compra · '+(COMPRAS[c.cat]?.n||c.cat), desc:`${c.fornecedor||''} · ${c.item}`, mod:'compras'}));
  db.logistica.forEach(l => L.push({key:'l:'+l.id, data:l.data, valor:-(+l.valor||0), tipo:LOGT[l.tipo]||l.tipo, desc:[l.prestador,l.origem&&l.destino?l.origem+' → '+l.destino:'',l.obs].filter(Boolean).join(' · '), mod:'logistica'}));
  return L.filter(m => m.data && m.valor);
}
function linkMap(){ const m = {}; S.db.banco.forEach(b => (b.links||[]).forEach(k => m[k] = b.id)); return m; }
function unlinkKeys(keys){ S.db.banco.forEach(b => { if (b.links && b.links.some(k=>keys.includes(k))){ b.links = b.links.filter(k=>!keys.includes(k)); if (!b.links.length){ b.links = null; b.modo = null; } } }); }
const bStatus = b => b.ignorado ? 'Ignorado' : (b.links && b.links.length) ? 'Conciliado' : 'Pendente';
function runAutoConc(silent){
  const movs = movimentos(), lm = linkMap(); let n = 0;
  const livres = movs.filter(m => !lm[m.key]);
  S.db.banco.filter(b => !b.ignorado && !(b.links && b.links.length)).sort((a,b)=>a.data<b.data?-1:1).forEach(b => {
    let best = null, bd = 1e9;
    livres.forEach(m => { if (lm[m.key]) return; if (Math.abs(m.valor - b.valor) > 0.01) return; const dd = Math.abs(days(m.data, b.data)); if (dd <= TOL_DIAS && dd < bd){ best = m; bd = dd; } });
    if (best){ b.links = [best.key]; b.modo = 'auto'; lm[best.key] = b.id; n++; }
  });
  save(); if (!silent) toast(n ? `${n} movimento(s) conciliado(s) automaticamente.` : 'Nenhuma nova correspondência exata (mesmo valor, até 3 dias).', !n); return n;
}
window.autoConciliar = () => { runAutoConc(); render(); };

// ---------- leitura de OFX / CSV ----------
async function lerTexto(file){
  const buf = await file.arrayBuffer(); let t = new TextDecoder('utf-8').decode(buf);
  if (t.includes('�')) t = new TextDecoder('latin1').decode(buf); return t;
}
function parseOFX(t){
  const out = []; const blocks = t.split(/<STMTTRN>/i).slice(1);
  const tag = (b, n) => { const m = b.match(new RegExp('<'+n+'>([^<\\r\\n]*)','i')); return m ? m[1].trim() : ''; };
  blocks.forEach(b => { const dt = tag(b,'DTPOSTED'); const v = parseFloat(tag(b,'TRNAMT').replace(',','.'));
    if (!dt || isNaN(v)) return; out.push({data:`${dt.slice(0,4)}-${dt.slice(4,6)}-${dt.slice(6,8)}`, valor:r2(v), desc:[tag(b,'NAME'),tag(b,'MEMO')].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).join(' · ') || tag(b,'TRNTYPE'), fitid:tag(b,'FITID')}); });
  return out;
}
function parseCSV(t){
  const lines = t.split(/\r?\n/).filter(l => l.trim()); if (!lines.length) return [];
  const sep = [';','\t',','].map(s => [s, (lines[0].match(new RegExp(s==='\t'?'\\t':'\\'+s,'g'))||[]).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const split = l => { const r = []; let cur = '', q = false; for (const ch of l){ if (ch === '"') q = !q; else if (ch === sep && !q){ r.push(cur); cur = ''; } else cur += ch; } r.push(cur); return r.map(x => x.trim()); };
  let hi = lines.findIndex(l => /data/i.test(l) && /(valor|cr[ée]dito|d[ée]bito|entrada|sa[íi]da|montante)/i.test(l)); if (hi < 0) hi = 0;
  const H = split(lines[hi]).map(norm);
  const col = (...re) => { for (const r of re){ const i = H.findIndex(h => r.test(h)); if (i >= 0) return i; } return -1; };
  const cD = col(/^data/, /date/), cV = col(/^valor/, /montante/, /amount/), cDesc = col(/descri/, /hist/, /lancamento/, /memo/, /detalhe/, /titulo/, /identifica/);
  const cC = col(/credito/, /entrada/), cDb = col(/debito/, /saida/);
  const num = s => { s = String(s||'').replace(/R\$|\s/g,''); if (!s) return NaN; const neg = /^-|\($|^\(|-$/.test(s) || /D$/i.test(s); s = s.replace(/[()D-]/gi,''); if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g,'').replace(',','.'); else s = s.replace(/,/g,''); const v = parseFloat(s); return isNaN(v) ? NaN : neg ? -v : v; };
  const dt = s => { s = String(s||'').trim(); let m = s.match(/^(\d{2})\/(\d{2})\/(\d{2,4})/); if (m) return `${m[3].length===2?'20'+m[3]:m[3]}-${m[2]}-${m[1]}`; m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[1]}-${m[2]}-${m[3]}` : null; };
  const out = [];
  lines.slice(hi+1).forEach(l => { const c = split(l); const d = dt(c[cD >= 0 ? cD : 0]); if (!d) return;
    let v = cV >= 0 ? num(c[cV]) : NaN; if (isNaN(v) && (cC >= 0 || cDb >= 0)){ const cr = num(c[cC]), db = num(c[cDb]); v = (isNaN(cr)?0:Math.abs(cr)) - (isNaN(db)?0:Math.abs(db)); }
    if (isNaN(v) || !v) return; out.push({data:d, valor:r2(v), desc:cDesc >= 0 ? c[cDesc] : c.filter((x,i)=>i!==cD && i!==cV).join(' '), fitid:''}); });
  return out;
}

  try {
    const t = await lerTexto(file); const rows = /<OFX>|<STMTTRN>/i.test(t) ? parseOFX(t) : parseCSV(t);
    if (!rows.length) throw new Error('Nenhum movimento reconhecido no arquivo.');
    const sig = b => `${b.conta}|${b.data}|${b.valor.toFixed(2)}|${norm(b.desc)}`;
    const exist = new Set(S.db.banco.map(b => b.fitid ? b.conta+'#'+b.fitid : sig(b)));
    rows.forEach(r => { r.conta = conta; r.dup = exist.has(r.fitid ? conta+'#'+r.fitid : sig(r)); });
    BIMP = {conta, arquivo:file.name, rows};
    const novos = rows.filter(r=>!r.dup), ent = sum(novos.filter(r=>r.valor>0),r=>r.valor), sai = sum(novos.filter(r=>r.valor<0),r=>r.valor);
    const ds = rows.map(r=>r.data).sort();
    $('#modal').innerHTML = `<div class="modal-h"><h3>Conferir extrato · ${esc(conta)}</h3><button class="x" onclick="closeModal()">×</button></div>
      <div class="modal-b" style="display:block">
        <div class="kpis" style="grid-template-columns:repeat(4,1fr)">${kpi('Movimentos novos',String(novos.length),`${rows.length-novos.length} já importado(s) antes`,'t-blue')}${kpi('Período',`${fdate(ds[0]).slice(0,5)}–${fdate(ds[ds.length-1]).slice(0,5)}`,ds[0].slice(0,4),'t-gray')}${kpi('Entradas',money(ent),'','t-green')}${kpi('Saídas',money(-sai),'','t-red')}</div>
        <div class="tbl-wrap" style="max-height:340px"><table><thead><tr><th>Data</th><th>Descrição</th><th class="num">Valor</th><th></th></tr></thead><tbody>
        ${rows.slice(0,300).map(r=>`<tr class="${r.dup?'muted':''}"><td>${fdate(r.data)}</td><td>${esc(r.desc)}</td><td class="num ${r.valor<0?'neg':'pos'}">${money(r.valor)}</td><td>${r.dup?'<span class="tag neutral">já importado</span>':''}</td></tr>`).join('')}</tbody></table></div>
        <div class="muted" style="font-size:12px;margin-top:10px">Depois de importar, o sistema concilia automaticamente os movimentos com <b>mesmo valor e até ${TOL_DIAS} dias de diferença</b>. O restante você concilia manualmente ou cria o lançamento a partir do extrato.</div></div>
      <div class="modal-f"><button class="btn ghost" onclick="importarExtrato()">← Outro arquivo</button><span style="flex:1"></span><button class="btn primary" onclick="confirmarExtrato()" ${novos.length?'':'disabled'}>Importar ${novos.length} movimento(s)</button></div>`;
  } catch(e){ toast(e.message || 'Arquivo não reconhecido.', true); }
};
window.confirmarExtrato = () => {
  const novos = BIMP.rows.filter(r=>!r.dup);
  novos.forEach(r => S.db.banco.push({id:uid('b'), conta:r.conta, data:r.data, valor:r.valor, desc:r.desc, fitid:r.fitid||'', links:null, modo:null, ignorado:false, arquivo:BIMP.arquivo}));
  const n = runAutoConc(true); closeModal();
  toast(`${novos.length} movimento(s) importado(s) · ${n} conciliado(s) automaticamente.`);
  const ds = novos.map(r=>r.data).sort(); if (ds.length){ UI.year = +ds[ds.length-1].slice(0,4); UI.month = +ds[ds.length-1].slice(5,7); fillPeriod(); persistUI(); }
  UI.conta = BIMP.conta; go('conciliacao');
};

function renderConciliacao(){
  const contas = [...new Set(S.db.banco.map(b=>b.conta))].sort(); const conta = contas.includes(UI.conta) ? UI.conta : '';
  const movs = movimentos(); const byKey = Object.fromEntries(movs.map(m=>[m.key,m])); const lm = linkMap();

  const conc = linhas.filter(b=>bStatus(b)==='Conciliado'), pend = linhas.filter(b=>bStatus(b)==='Pendente');
  const ext = linhas.slice().sort((a,b)=>a.data<b.data?-1:1);
