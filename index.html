  if (q) linhas = linhas.filter(b => norm(b.desc+' '+(b.links||[]).map(k=>byKey[k]?.desc||'').join(' ')+' '+b.valor).includes(q));
  linhas.sort((a,b)=>a.data<b.data?1:a.data>b.data?-1:0);
  const ent = sum(ext.filter(b=>b.valor>0),b=>b.valor), sai = sum(ext.filter(b=>b.valor<0),b=>b.valor);
  const pctC = ext.length ? conc.length / ext.filter(b=>!b.ignorado).length : 0;
  const head = pageHead('Conciliação Bancária', `Cruza o <b>extrato do banco</b> com os lançamentos do sistema (vendas, recebimentos, repasses de cartão, contas pagas, compras e logística) — ${periodLabel()}.`,
    `<button class="btn" onclick="autoConciliar()">⚡ Conciliar automaticamente</button><button class="btn" onclick="exportConc()">⬇ Excel</button><button class="btn primary" onclick="importarExtrato()">⬆ Importar extrato (OFX/CSV)</button>`);
  if (!S.db.banco.length){
    $('#view').innerHTML = head + `<div class="panel"><div class="panel-b" style="padding:40px;text-align:center"><div style="font-size:40px">🏦</div><h3 style="margin:8px 0">Nenhum extrato importado ainda</h3>
      <p class="t2" style="max-width:560px;margin:0 auto 16px">Exporte o extrato da conta no internet banking em <b>OFX</b> (ou CSV) e importe aqui. O sistema encontra sozinho os lançamentos correspondentes e mostra o que está no banco e não foi lançado — e o que foi lançado e não aparece no banco.</p>
      <button class="btn primary" onclick="importarExtrato()">⬆ Importar extrato</button></div></div>`; return;
  }
  const kp = [kpi('Movimentos no extrato', String(ext.length), `entradas ${moneyK(ent)} · saídas ${moneyK(-sai)}`, 't-blue'),
    kpi('Conciliados', pct(pctC,0), `${conc.length} movimento(s)`, pctC>=0.95?'t-green':'t-yellow'),
    kpi('Pendentes no extrato', String(pend.length), `${money(sum(pend,b=>b.valor))} sem lançamento correspondente`, pend.length?'t-red':'t-green'),
    kpi('Lançados sem extrato', String(semExt.length), ini ? `no intervalo ${fdate(ini).slice(0,5)}–${fdate(fim).slice(0,5)} · ${money(sum(semExt,m=>m.valor))}` : '', semExt.length?'t-yellow':'t-green'),
    kpi('Saldo do extrato no período', money(ent+sai), `sistema conciliado: ${money(sum(conc,b=>sum(b.links,k=>byKey[k]?.valor||0)))}`, 't-gray')].join('');
  const rowsHTML = linhas.map(b => { const s = bStatus(b); const ls = (b.links||[]).map(k=>byKey[k]).filter(Boolean); const tot = sum(ls,m=>m.valor); const dif = ls.length ? r2(b.valor - tot) : 0;
    return `<tr><td>${fdate(b.data)}${conta?'':`<div class="muted" style="font-size:11px">${esc(b.conta)}</div>`}</td><td>${esc(b.desc)}</td><td class="num ${b.valor<0?'neg':'pos'}">${money(b.valor)}</td>
      <td><span class="tag ${s==='Conciliado'?'good':s==='Ignorado'?'neutral':'bad'}">${s}${b.modo==='auto'?' · auto':''}</span></td>
      <td style="max-width:380px">${ls.map(m=>`<div><span class="muted">${esc(m.tipo)}:</span> ${esc(m.desc)} <span class="mono" style="font-size:11.5px">${money(m.valor)}</span> <span class="muted" style="font-size:11px">${fdate(m.data)}</span></div>`).join('')}${dif?`<div class="neg" style="font-size:11.5px">diferença ${money(dif)}</div>`:''}${b.ignorado&&b.motivo?`<span class="muted">${esc(b.motivo)}</span>`:''}</td>
      <td><div class="row-act">${s==='Pendente'?`<button class="btn sm" onclick="concManual('${b.id}')">🔗 Conciliar</button><button class="btn sm" onclick="criarDoExtrato('${b.id}')">＋ Lançar</button><button class="icon-btn" title="Ignorar (transferência entre contas, aplicação…)" onclick="ignorarBanco('${b.id}')">🚫</button>`:`<button class="btn sm" onclick="desfazerBanco('${b.id}')">↺ Desfazer</button>`}<button class="icon-btn" title="Excluir do extrato" onclick="delBanco('${b.id}')">🗑</button></div></td></tr>`; }).join('');
  const semHTML = semExt.sort((a,b)=>a.data<b.data?-1:1).map(m => `<tr><td>${fdate(m.data)}</td><td><span class="tag neutral">${esc(m.tipo)}</span></td><td>${esc(m.desc)}</td><td class="num ${m.valor<0?'neg':'pos'}">${money(m.valor)}</td><td><button class="btn sm" onclick="go('${m.mod}')">Abrir módulo</button></td></tr>`).join('');
  $('#view').innerHTML = head + `<div class="kpis">${kp}</div>
    <div class="panel"><div class="toolbar"><div class="tabs"><button class="tab ${tab==='extrato'?'on':''}" onclick="UI.tab.conc='extrato';render()">Extrato bancário (${ext.length})</button><button class="tab ${tab==='sem'?'on':''}" onclick="UI.tab.conc='sem';render()">Lançados sem extrato (${semExt.length})</button></div>
      <select onchange="UI.conta=this.value;render()"><option value="">Conta: todas</option>${contas.map(c=>`<option ${c===conta?'selected':''}>${esc(c)}</option>`).join('')}</select>
      ${tab==='extrato'?`<select onchange="UI.f.conc={st:this.value};render()"><option value="">Situação: todas</option>${['Pendente','Conciliado','Ignorado'].map(s=>`<option ${st===s?'selected':''}>${s}</option>`).join('')}</select>
      <input class="search" id="q_conc" placeholder="Buscar no extrato…" value="${esc(UI.q.conc||'')}" oninput="setQ('conc',this.value)">`:''}<span class="count">${periodLabel()}</span></div>
      <div class="tbl-wrap">${tab==='extrato' ? `<table><thead><tr><th>Data</th><th>Descrição no banco</th><th class="num">Valor</th><th>Situação</th><th>Lançamento no sistema</th><th></th></tr></thead><tbody>${rowsHTML||`<tr><td colspan="6" class="empty">Nenhum movimento do extrato em ${periodLabel()}.</td></tr>`}</tbody></table>`
        : `<table><thead><tr><th>Data</th><th>Tipo</th><th>Lançamento</th><th class="num">Valor</th><th></th></tr></thead><tbody>${semHTML||'<tr><td colspan="5" class="empty">Todos os lançamentos do intervalo do extrato foram encontrados no banco.</td></tr>'}</tbody></table>`}</div>
      <div class="note">${tab==='extrato' ? '<b>Pendente</b> = movimento do banco sem lançamento correspondente no sistema: concilie com um lançamento existente (pode marcar vários que somem o valor, como um repasse de cartão com várias parcelas) ou lance a partir do extrato.' : 'Lançamentos do sistema dentro do intervalo do extrato que não apareceram no banco: podem ter sido pagos por outra conta, em dinheiro, ou lançados com data/valor errado.'}</div></div>`;
}
window.exportConc = () => {
  if (!window.XLSX){ toast('Exportação para Excel indisponível sem internet.', true); return; }
  const byKey = Object.fromEntries(movimentos().map(m=>[m.key,m]));
  const data = S.db.banco.filter(b=>inPeriod(b.data)).map(b => ({Conta:b.conta, Data:fdate(b.data), 'Descrição no banco':b.desc, Valor:b.valor, Situação:bStatus(b), 'Lançamento no sistema':(b.links||[]).map(k=>byKey[k]?`${byKey[k].tipo}: ${byKey[k].desc} (${money(byKey[k].valor)})`:'').join(' | ')}));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), 'Conciliação'); XLSX.writeFile(wb, `Conciliação bancária - ${periodLabel().replace('/','-')}.xlsx`);
};
window.ignorarBanco = id => { const b = S.db.banco.find(x=>x.id===id);
  openModal(`<div class="modal-h"><h3>Ignorar movimento</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-b" style="display:block"><p class="t2" style="margin-top:0">${fdate(b.data)} · ${esc(b.desc)} · <b>${money(b.valor)}</b></p>
    <div class="fld"><label>Motivo</label><select id="ig_m"><option>Transferência entre contas próprias</option><option>Aplicação / resgate</option><option>Estorno</option><option>Tarifa bancária já considerada</option><option>Outro</option></select></div></div>
    <div class="modal-f"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" id="ig_ok">Ignorar</button></div>`, true);
  $('#ig_ok').onclick = () => { b.ignorado = true; b.motivo = $('#ig_m').value; save(); closeModal(); render(); };
};
window.desfazerBanco = id => { const b = S.db.banco.find(x=>x.id===id); b.links = null; b.modo = null; b.ignorado = false; b.motivo = ''; save(); render(); };
window.delBanco = id => confirmBox('Excluir movimento do extrato', 'Remove esta linha do extrato importado (os lançamentos do sistema não são alterados).', 'Excluir', () => { S.db.banco = S.db.banco.filter(x=>x.id!==id); save(); render(); });
window.concManual = (id, filtro='') => {
  const b = S.db.banco.find(x=>x.id===id); const lm = linkMap();
  const sel = new Set((window._concSel && window._concSel.id===id) ? window._concSel.keys : []); window._concSel = {id, keys:[...sel]};
  const dias = +(window._concDias||10);
  let c = movimentos().filter(m => Math.sign(m.valor)===Math.sign(b.valor) && (!lm[m.key] || lm[m.key]===id) && Math.abs(days(m.data,b.data))<=dias);
  const f = norm(filtro); if (f) c = c.filter(m => norm(m.tipo+' '+m.desc+' '+m.valor).includes(f));
  c.sort((x,y) => (Math.abs(x.valor-b.valor) - Math.abs(y.valor-b.valor)) || (Math.abs(days(x.data,b.data)) - Math.abs(days(y.data,b.data))));
  const mov = movimentos(); const tot = sum(mov.filter(m=>sel.has(m.key)), m=>m.valor); const dif = r2(b.valor - tot);
  openModal(`<div class="modal-h"><h3>🔗 Conciliar movimento</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b" style="display:block">
      <div class="calc" style="margin-bottom:12px">Extrato · ${esc(b.conta)} · ${fdate(b.data)} · ${esc(b.desc)} · <b class="${b.valor<0?'neg':'pos'}">${money(b.valor)}</b></div>
      <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap"><input class="search" id="cm_q" placeholder="Filtrar lançamentos (fornecedor, OS, valor…)" value="${esc(filtro)}" style="max-width:none">
        <select id="cm_d" style="height:32px;background:var(--bg);border:1px solid var(--border-2);border-radius:8px;padding:0 8px">${[3,10,30,90].map(d=>`<option value="${d}" ${d===dias?'selected':''}>até ${d} dias</option>`).join('')}</select></div>
      <div class="tbl-wrap" style="max-height:340px"><table><thead><tr><th></th><th>Data</th><th>Tipo</th><th>Lançamento</th><th class="num">Valor</th></tr></thead><tbody>
      ${c.slice(0,200).map(m=>`<tr style="cursor:pointer" onclick="togConc('${id}','${m.key}')"><td><input type="checkbox" ${sel.has(m.key)?'checked':''} style="pointer-events:none"></td><td>${fdate(m.data)}</td><td><span class="tag neutral">${esc(m.tipo)}</span></td><td>${esc(m.desc)}</td><td class="num ${Math.abs(m.valor-b.valor)<=0.01?'pos':''}">${money(m.valor)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">Nenhum lançamento compatível nesse intervalo. Aumente o prazo ou use “＋ Lançar” para criar a partir do extrato.</td></tr>'}</tbody></table></div>
      <div class="imp-sum" style="margin-top:12px">Selecionado: <b>${money(tot)}</b> · Extrato: <b>${money(b.valor)}</b> · Diferença: <b class="${Math.abs(dif)>0.01?'neg':'pos'}">${money(dif)}</b>
        ${Math.abs(dif)>0.01 && sel.size ? '<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="cm_dif"> aceitar diferença (tarifa, juros, arredondamento)</label>' : ''}</div></div>
    <div class="modal-f"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="okConc('${id}')" ${sel.size?'':'disabled'}>Conciliar ${sel.size} lançamento(s)</button></div>`, 'lg');
  const qi = $('#cm_q'); qi.focus(); qi.setSelectionRange(filtro.length, filtro.length);
  let tm; qi.oninput = () => { clearTimeout(tm); tm = setTimeout(()=>concManual(id, qi.value), 250); };
  $('#cm_d').onchange = e => { window._concDias = +e.target.value; concManual(id, qi.value); };
};
window.togConc = (id, key) => { const s = window._concSel; const i = s.keys.indexOf(key); if (i>=0) s.keys.splice(i,1); else s.keys.push(key); concManual(id, $('#cm_q') ? $('#cm_q').value : ''); };
window.okConc = id => {
  const b = S.db.banco.find(x=>x.id===id); const keys = window._concSel.keys; const tot = sum(movimentos().filter(m=>keys.includes(m.key)), m=>m.valor);
  if (Math.abs(b.valor-tot) > 0.01 && !($('#cm_dif') && $('#cm_dif').checked)){ toast('Os valores não batem — marque “aceitar diferença” ou ajuste a seleção.', true); return; }
  b.links = keys.slice(); b.modo = 'manual'; window._concSel = null; save(); closeModal(); toast('Movimento conciliado.'); render();
};
window.criarDoExtrato = id => {
  const b = S.db.banco.find(x=>x.id===id); const ent = b.valor > 0; const v = Math.abs(b.valor);
  const abertas = S.db.duplicatas.filter(d=>dupSaldo(d)>0.01).sort((x,y)=>((Math.abs(dupSaldo(x)-v)<=0.01?0:1)-(Math.abs(dupSaldo(y)-v)<=0.01?0:1)) || (x.entrega<y.entrega?1:-1));
  const tipos = ent ? [['venda','Venda / sinal (Vendas & Entradas)'],['outras','Outra receita'],['dup','Recebimento de duplicata (total ou parcial)']] : [['pagar','Conta paga (Contas a Pagar)'],['compra','Compra de insumo'],['log','Logística / frete']];
  openModal(`<div class="modal-h"><h3>＋ Lançar a partir do extrato</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b"><div class="calc">${esc(b.conta)} · ${fdate(b.data)} · ${esc(b.desc)} · <b class="${ent?'pos':'neg'}">${money(b.valor)}</b></div>
      <div class="fld full"><label>Lançar como</label><select id="cx_t">${tipos.map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div>
      <div class="fld full" data-t="pagar compra log venda outras"><label>Descrição / fornecedor</label><input id="cx_desc" value="${esc(b.desc)}"></div>
      <div class="fld" data-t="pagar"><label>Categoria (plano de contas)</label><select id="cx_cat">${optPlano().map(o=>`<option value="${o.v}">${esc(o.l)}</option>`).join('')}</select></div>
      <div class="fld" data-t="compra"><label>Insumo</label><select id="cx_ins">${Object.entries(COMPRAS).map(([k,o])=>`<option value="${k}">${esc(o.n)}</option>`).join('')}</select></div>
      <div class="fld" data-t="log"><label>Tipo</label><select id="cx_log">${Object.entries(LOGT).map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join('')}</select></div>
      <div class="fld full" data-t="dup"><label>Duplicata (OS com saldo)</label><select id="cx_dup">${abertas.map(d=>`<option value="${d.id}">OS ${esc(d.os)} · ${esc(d.cliente||'')} · saldo ${money(dupSaldo(d))}${Math.abs(dupSaldo(d)-v)<=0.01?' ✓ valor exato':''}</option>`).join('')||'<option value="">Nenhuma duplicata em aberto</option>'}</select><div class="hint">Se o valor for menor que o saldo, fica registrado como pagamento parcial.</div></div>
      <div class="fld" data-t="dup venda outras"><label>Forma</label><select id="cx_forma">${FORMAS.map(f=>`<option>${f}</option>`).join('')}</select></div>
    </div><div class="modal-f"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" id="cx_ok">Lançar e conciliar</button></div>`);
  const sync = () => { const t = $('#cx_t').value; document.querySelectorAll('#modal [data-t]').forEach(e => e.style.display = e.dataset.t.split(' ').includes(t) ? '' : 'none'); };
  $('#cx_t').onchange = sync; sync();
  $('#cx_ok').onclick = () => {
    const t = $('#cx_t').value, desc = $('#cx_desc').value.trim() || b.desc; let key;
    if (t==='venda' || t==='outras'){ const r = {id:uid('r'), data:b.data, tipo:t, descricao:desc, forma:$('#cx_forma').value, valor:v, obs:'Lançado pela conciliação'}; S.db.receitas.push(r); key = 'r:'+r.id; }
    if (t==='dup'){ const d = S.db.duplicatas.find(x=>x.id===$('#cx_dup').value); if (!d){ toast('Escolha uma duplicata.', true); return; } if (v > dupSaldo(d)+0.01){ toast(`Valor maior que o saldo da OS (${money(dupSaldo(d))}).`, true); return; }
      const p = {id:uid('pg'), data:b.data, valor:v, forma:$('#cx_forma').value, obs:'Lançado pela conciliação'}; d.pagamentos = d.pagamentos||[]; d.pagamentos.push(p); key = `dp:${d.id}:${p.id}`; }
    if (t==='pagar'){ const p = {id:uid('p'), fornecedor:desc, descricao:desc, categoria:$('#cx_cat').value, valor:v, venc:b.data, status:'pago', dataPg:b.data, juros:0, multa:0, valorPago:v, fonte:b.conta, obs:'Lançado pela conciliação'}; S.db.pagar.push(p); key = 'p:'+p.id; }
    if (t==='compra'){ const c = {id:uid('c'), cat:$('#cx_ins').value, data:b.data, item:desc, fornecedor:'', qtd:null, unid:COMPRAS[$('#cx_ins').value].u, preco:null, total:v, extra:'Lançado pela conciliação'}; S.db.compras.push(c); key = 'c:'+c.id; }
    if (t==='log'){ const l = {id:uid('l'), tipo:$('#cx_log').value, data:b.data, prestador:desc, origem:'', destino:'', qtd:1, valor:v, obs:'Lançado pela conciliação'}; S.db.logistica.push(l); key = 'l:'+l.id; }
    b.links = [key]; b.modo = 'manual'; save(); closeModal(); toast('Lançamento criado e conciliado.'); render();
  };
};

const PLANO_PADRAO = JSON.parse(JSON.stringify({contas:PLANO, grupos:GRUPOS, insumos:COMPRAS, logistica:LOGT}));

}
window.renderPlano = () => { const el = $('#planoBox'); if (el) el.outerHTML = planoHTML(); };
window.setPlano = (path, v) => { const ps = path.split('.'); let o = PED; for (let i=0;i<ps.length-1;i++) o = o[ps[i]]; o[ps[ps.length-1]] = ps[0]==='insumos'&&ps[2]==='u' ? v.trim() : v; if (ps[0]==='contas' && ps[2]==='g') renderPlano(); };
window.addPlano = () => {
  const n = $('#pl_new').value.trim(); if (!n){ toast('Informe o nome.', true); return; }
  const t = window.planoTab; let k = norm(n).replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,30) || 'conta'; while (PED[t][k]) k += '_2';
  if (t==='contas') PED.contas[k] = {n, g:$('#pl_g').value};
  if (t==='insumos'){ const u = ($('#pl_u').value||'un').trim(); PED.insumos[k] = {n, u, pu:'R$/'+u, q:'Quantidade'}; }
  if (t==='logistica') PED.logistica[k] = n;
  renderPlano(); toast('Incluída no rascunho — clique em “Salvar plano de contas”.');

window.delPlano = (kind, k) => {
  const usos = usoConta(kind, k), outras = Object.keys(PED[kind]).filter(x=>x!==k);
  if (!outras.length){ toast('O plano precisa ter pelo menos uma conta nesse grupo.', true); return; }
  const nome = kind==='logistica' ? PED[kind][k] : PED[kind][k].n; const nomeDe = x => kind==='logistica' ? PED[kind][x] : PED[kind][x].n;
  if (!usos){ delete PED[kind][k]; renderPlano(); return; }
  openModal(`<div class="modal-h"><h3>Excluir “${esc(nome)}”</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-b" style="display:block">
    <p class="t2" style="margin-top:0">Esta conta tem <b>${usos}</b> lançamento(s). Para onde eles devem ser transferidos?</p>
    <div class="fld"><label>Transferir lançamentos para</label><select id="pl_dest">${outras.map(x=>`<option value="${x}">${esc(nomeDe(x))}</option>`).join('')}</select></div></div>
    <div class="modal-f"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn danger" id="pl_ok">Transferir e excluir</button></div>`, true);
  $('#pl_ok').onclick = () => { PED._mig = PED._mig || []; PED._mig.push({kind, de:k, para:$('#pl_dest').value}); delete PED[kind][k]; closeModal(); renderPlano(); toast('Exclusão no rascunho — clique em “Salvar plano de contas” para aplicar.'); };
};
window.resetPlano = () => confirmBox('Restaurar plano padrão', 'Volta o plano de contas para o padrão original. Lançamentos em contas criadas por você serão movidos para “Despesas gerais” / primeiro item de cada lista.', 'Restaurar', () => {
  const p = JSON.parse(JSON.stringify(PLANO_PADRAO)); p._mig = [];
  Object.keys(S.cfg.plano?.contas||{}).forEach(k => { if (!p.contas[k]) p._mig.push({kind:'contas', de:k, para:'gerais'}); });
  Object.keys(S.cfg.plano?.insumos||{}).forEach(k => { if (!p.insumos[k]) p._mig.push({kind:'insumos', de:k, para:Object.keys(p.insumos)[0]}); });
  Object.keys(S.cfg.plano?.logistica||{}).forEach(k => { if (!p.logistica[k]) p._mig.push({kind:'logistica', de:k, para:Object.keys(p.logistica)[0]}); });
  PED = p; salvarPlano();
}, false);
window.salvarPlano = () => {
  const mig = PED._mig || []; delete PED._mig; let n = 0;
  const fold = (kind, de) => { let x = de; for (let i=0;i<20;i++){ const m = mig.find(z=>z.kind===kind && z.de===x); if (!m) break; x = m.para; } return x; };
  mig.forEach(({kind, de}) => { const para = fold(kind, de);
    if (kind==='contas') S.db.pagar.forEach(r => { if (r.categoria===de){ r.categoria = para; n++; } });
    if (kind==='insumos') S.db.compras.forEach(r => { if (r.cat===de){ r.cat = para; n++; } });
    if (kind==='logistica') S.db.logistica.forEach(r => { if (r.tipo===de){ r.tipo = para; n++; } }); });
  Object.values(PED.contas).forEach(c => c.n = (c.n||'').trim() || 'Sem nome');
  S.cfg.plano = PED; PED = null; applyPlano(); save();

/* =====================================================================
   MODO ONLINE — Supabase (login, sincronização, tempo real, usuários)
   Ativo só quando config.js traz supabaseUrl e supabaseAnonKey.
   ===================================================================== */
let SB = null, ME = null, SNAP = {}, RT = null;
const SYNC = {state:'ok', busy:false, again:false, timer:null, retry:null, err:'', pend:0};
const TBL = {receitas:'receitas', duplicatas:'duplicatas', cartao:'cartoes', pagar:'contas_pagar', compras:'compras', logistica:'logistica',
             extrato:'relatorio_pagamentos', banco:'extrato_bancario', pedidos:'pedidos'};
const COLL = Object.fromEntries(Object.entries(TBL).map(([c,t]) => [t,c]));
const PAPEIS = {admin:'Administrador', financeiro:'Financeiro (lança)', leitura:'Somente leitura', pendente:'Pendente (sem acesso)'};

function cloudPill(){
  const p = $('#savePill'); if (!p) return;
  const m = {ok:['', 'Sincronizado'], sync:[' warn', 'Salvando no banco…'], err:[' err', 'Erro ao salvar — tentando de novo'], off:[' err', 'Sem conexão com o banco'], ro:['', 'Somente leitura']};
  const [c, t] = m[SYNC.state] || m.ok;
  p.className = 'pill hide-sm' + c; p.title = SYNC.err || ''; p.innerHTML = `<span class="dot"></span><span>${t}</span>`;
}
const cloudErr = e => { const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/row-level security|permission denied|42501/i.test(m)) return 'Seu perfil não tem permissão para lançar.';
  if (/Failed to fetch|NetworkError|network/i.test(m)) return 'Sem conexão com a internet / Supabase.';
  return m; };

async function fetchAll(tbl){
  const out = [];
  for (let from = 0; ; from += 1000){
    const {data, error} = await SB.from(tbl).select('id,dados').order('id').range(from, from + 999);
    if (error) throw error; out.push(...data); if (data.length < 1000) break;
  }
  return out;
}
async function cloudLoad(){
  const db = {}; SNAP = {};
  await Promise.all(Object.entries(TBL).map(async ([c, t]) => {
    const rows = await fetchAll(t); SNAP[c] = new Map(rows.map(r => [r.id, JSON.stringify(r.dados)])); db[c] = rows.map(r => r.dados);
  }));
  const conf = await fetchAll('configuracoes');
  const cfg = conf.find(r => r.id === 'geral'), hist = conf.find(r => r.id === 'historico');
  SNAP._cfg = cfg ? JSON.stringify(cfg.dados) : null; SNAP._hist = hist ? JSON.stringify(hist.dados) : null;
  S = normalize({db, cfg: cfg ? cfg.dados : {}, hist: hist ? hist.dados : null});
  return Object.values(db).every(a => !a.length) && !cfg;
}

// Envia ao banco só o que mudou desde a última sincronização (inclusões, alterações e exclusões)
function cloudSchedule(){
  if (!SB || !ME) return;
  if (ME.papel === 'leitura'){ SYNC.state = 'ro'; cloudPill(); return; }
  clearTimeout(SYNC.timer); SYNC.timer = setTimeout(() => cloudSync(), 400);
}
async function cloudSync(force){
  if (!SB || !ME || ME.papel === 'leitura') return false;
  if (SYNC.busy){ SYNC.again = true; return new Promise(ok => { const w = setInterval(() => { if (!SYNC.busy){ clearInterval(w); ok(cloudSync(force)); } }, 150); }); }
  SYNC.busy = true; SYNC.state = 'sync'; cloudPill(); clearTimeout(SYNC.retry);
  try {
    for (const [c, t] of Object.entries(TBL)){
      const snap = SNAP[c] || (SNAP[c] = new Map()); const cur = new Map();
      (S.db[c] || []).forEach(r => { if (!r.id) r.id = uid('x'); cur.set(r.id, r); });
      const up = [], js = {};
      cur.forEach((r, id) => { const j = JSON.stringify(r); if (snap.get(id) !== j){ up.push({id, dados:r}); js[id] = j; } });
      const del = [...snap.keys()].filter(id => !cur.has(id));
      for (let i = 0; i < up.length; i += 400){
        const part = up.slice(i, i + 400); const {error} = await SB.from(t).upsert(part); if (error) throw error;
        part.forEach(r => snap.set(r.id, js[r.id]));
      }
      for (let i = 0; i < del.length; i += 200){
        const part = del.slice(i, i + 200); const {error} = await SB.from(t).delete().in('id', part); if (error) throw error;
        part.forEach(id => snap.delete(id));
      }
    }
    const cj = JSON.stringify(S.cfg);
    if (cj !== SNAP._cfg){ const {error} = await SB.from('configuracoes').upsert({id:'geral', dados:S.cfg}); if (error) throw error; SNAP._cfg = cj; }
    if (S.hist){ const hj = JSON.stringify(S.hist); if (hj !== SNAP._hist){ const {error} = await SB.from('configuracoes').upsert({id:'historico', dados:S.hist}); if (error) throw error; SNAP._hist = hj; } }
    SYNC.state = 'ok'; SYNC.err = ''; return true;
  } catch(e){
    SYNC.err = cloudErr(e); SYNC.state = /permissão/.test(SYNC.err) ? 'ro' : 'err';
    toast('Não foi possível salvar no banco: ' + SYNC.err, true);
    if (SYNC.state === 'err') SYNC.retry = setTimeout(() => cloudSync(), 15000);
    return false;
  } finally {
    SYNC.busy = false; cloudPill();
    if (SYNC.again){ SYNC.again = false; cloudSchedule(); }
  }
}

// Tempo real: alterações feitas por outros usuários aparecem na hora
let rtTimer = null;
function rtRender(){
  clearTimeout(rtTimer);
  rtTimer = setTimeout(() => {
    const ae = document.activeElement; const typing = ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName) && ae.closest('#view');
    if ($('#overlay').classList.contains('on') || typing){ rtRender(); return; }
    applyPlano(); render(); badges();
  }, 600);
}
function cloudRealtime(){
  if (RT) SB.removeChannel(RT);
  RT = SB.channel('master-financeiro').on('postgres_changes', {event:'*', schema:'public'}, p => {
    if (p.table === 'configuracoes'){
      if (p.eventType === 'DELETE') return; const j = JSON.stringify(p.new.dados);
      if (p.new.id === 'geral' && j !== SNAP._cfg){ SNAP._cfg = j; S.cfg = normalize({db:{}, cfg:p.new.dados}).cfg; rtRender(); }
      if (p.new.id === 'historico' && j !== SNAP._hist){ SNAP._hist = j; S.hist = p.new.dados; rtRender(); }
      return;
    }
    const c = COLL[p.table]; if (!c) return; const snap = SNAP[c] || (SNAP[c] = new Map());
    if (p.eventType === 'DELETE'){ const id = p.old && p.old.id; if (!id || !snap.has(id)) return; snap.delete(id); S.db[c] = S.db[c].filter(r => r.id !== id); }
    else { const rec = p.new.dados, j = JSON.stringify(rec); if (snap.get(rec.id) === j) return; snap.set(rec.id, j);
      const i = S.db[c].findIndex(r => r.id === rec.id); if (i >= 0) S.db[c][i] = rec; else S.db[c].push(rec); }
    rtRender();
  }).subscribe(st => { if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT'){ SYNC.state = 'off'; cloudPill(); } else if (st === 'SUBSCRIBED' && SYNC.state === 'off'){ SYNC.state = 'ok'; cloudPill(); } });
}

      gate(mode, `<span class="neg">${esc(t)}</span>`);
    }
  };
}
window.gate = gate;
window.sair = async () => { try { await SB.auth.signOut(); } catch(e){} location.hash = ''; location.reload(); };

async function cloudBoot(){
  if (!window.supabase || !window.supabase.createClient){ gate('erro', 'A biblioteca do Supabase não carregou. Verifique a conexão com a internet.'); return; }
  const recuperando = /type=(recovery|invite)/.test(location.hash);
  SB = window.supabase.createClient(MCFG.supabaseUrl, MCFG.supabaseAnonKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
  SB.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') gate('newpass'); });
  try {
    const {data:{session}} = await SB.auth.getSession();
    if (!session){ gate('login'); return; }
    if (recuperando){ gate('newpass', 'Crie sua senha para acessar o sistema.'); return; }
    await depoisDoLogin(session);
  } catch(e){ gate('erro', esc(cloudErr(e))); }
}
async function depoisDoLogin(session){
  gate('loading', 'Verificando seu acesso…');
  const u = session.user; ME = {id:u.id, email:u.email, papel:'pendente', nome:''};
  const {data:pf} = await SB.from('perfis').select('papel,nome').eq('id', u.id).maybeSingle();
  if (pf){ ME.papel = pf.papel; ME.nome = pf.nome || ''; }
  if (ME.papel === 'pendente'){ gate('pendente'); return; }
  gate('loading', 'Carregando lançamentos do banco…');
  let vazio;
  try { vazio = await cloudLoad(); } catch(e){ gate('erro', 'Erro ao ler o banco: ' + esc(cloudErr(e)) + '<br><br><span class="muted">Confira se o arquivo <b>schema.sql</b> foi executado no Supabase.</span>'); return; }
  $('#gate').style.display = 'none'; document.body.classList.remove('gated');
  document.body.classList.toggle('ro', ME.papel === 'leitura');
  const tb = document.querySelector('.topbar');
  if (!$('#userPill')){ const s = document.createElement('span'); s.id = 'userPill'; s.className = 'pill hide-sm'; s.style.cursor = 'pointer'; s.title = 'Sair do sistema'; s.onclick = () => confirmBox('Sair', 'Encerrar a sessão neste navegador?', 'Sair', sair, false); tb.insertBefore(s, $('#quickAdd')); }
  $('#userPill').innerHTML = `👤 ${esc(ME.nome || ME.email)} · <span class="muted">${esc((PAPEIS[ME.papel]||'').split(' ')[0])}</span> · <span style="color:var(--accent)">Sair</span>`;
  SYNC.state = ME.papel === 'leitura' ? 'ro' : 'ok';
  startApp(); cloudRealtime();
  if (vazio && ME.papel !== 'leitura') onboarding();
}
function onboarding(){
  openModal(`<div class="modal-h"><h3>🎉 Banco de dados conectado</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b" style="display:block"><p class="t2" style="margin-top:0">O banco ainda está vazio. Como você quer começar?</p>
      <label class="btn primary" style="width:100%;height:auto;padding:14px;justify-content:flex-start;cursor:pointer;white-space:normal;text-align:left">⬆ <span><b>Carregar um arquivo .json</b><br><span style="font-weight:400;opacity:.9">O backup baixado da versão local (Configurações → Baixar backup) ou o arquivo <b>dados_iniciais_2025.json</b> que veio com o sistema.</span></span><input type="file" accept=".json,application/json" style="display:none" onchange="restore(this.files[0])"></label>
      <button class="btn" style="width:100%;margin-top:10px;justify-content:flex-start" onclick="closeModal();save()">Começar com o banco vazio</button></div>`, 'lg');
}

// ---------- Configurações: usuários, auditoria, senha ----------
function cloudConfigHTML(){
  const adm = ME && ME.papel === 'admin';
  return `<div class="grid g2e" style="margin-top:14px">
    <div class="panel"><div class="panel-h"><h3>Minha conta</h3><span class="sub">${esc(ME.email)} · ${esc(PAPEIS[ME.papel]||ME.papel)}</span></div><div class="panel-b">
      <form id="fpw" style="display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end"><div class="fld"><label>Nova senha</label><input type="password" id="pw1" minlength="6" required autocomplete="new-password"></div><div class="fld"><label>Repita</label><input type="password" id="pw2" minlength="6" required></div><button class="btn">Alterar senha</button></form>
      <div style="margin-top:12px;display:flex;gap:8px"><button class="btn" onclick="sair()">Sair do sistema</button><span class="muted" style="font-size:12px;align-self:center">Banco: ${esc(MCFG.supabaseUrl.replace(/^https?:\/\//,''))}</span></div></div></div>
    ${adm ? `<div class="panel"><div class="panel-h"><h3>Usuários e acessos</h3><span class="sub">libere quem solicitou acesso</span></div><div class="tbl-wrap" style="max-height:300px" id="usrBox"><div class="empty">Carregando…</div></div>
      <div class="note"><b>Administrador</b>: tudo · <b>Financeiro</b>: consulta e lança · <b>Somente leitura</b>: só consulta · <b>Pendente</b>: sem acesso. Novos usuários entram pelo “Solicitar acesso” da tela de login.</div></div>` : ''}
  </div>
  ${adm ? `<div class="panel" style="margin-top:14px"><div class="panel-h"><h3>Últimas alterações</h3><span class="sub">auditoria — quem incluiu, alterou ou excluiu</span></div><div class="tbl-wrap" style="max-height:380px" id="audBox"><div class="empty">Carregando…</div></div></div>` : ''}`;
}
async function cloudConfigLoad(){
  const f = $('#fpw'); if (f) f.onsubmit = async e => { e.preventDefault(); if ($('#pw1').value !== $('#pw2').value){ toast('As senhas não conferem.', true); return; }
    const {error} = await SB.auth.updateUser({password:$('#pw1').value}); toast(error ? cloudErr(error) : 'Senha alterada.', !!error); if (!error) f.reset(); };
  if (!ME || ME.papel !== 'admin') return;
  const {data:us, error} = await SB.from('perfis').select('id,email,nome,papel,criado_em').order('criado_em');
  if ($('#usrBox')) $('#usrBox').innerHTML = error ? `<div class="empty">${esc(cloudErr(error))}</div>` : `<table><thead><tr><th>Usuário</th><th>Desde</th><th>Acesso</th></tr></thead><tbody>${us.map(u => `<tr><td>${esc(u.nome||'')}<div class="muted" style="font-size:11.5px">${esc(u.email||'')}</div></td><td>${fdate((u.criado_em||'').slice(0,10))}</td>
      <td><select ${u.id===ME.id?'disabled title="Você não pode alterar o próprio acesso"':''} style="height:30px;background:var(--bg);border:1px solid var(--border-2);border-radius:6px;padding:0 6px" onchange="mudaPapel('${u.id}',this.value)">${Object.entries(PAPEIS).map(([k,l])=>`<option value="${k}" ${u.papel===k?'selected':''}>${l}</option>`).join('')}</select>${u.papel==='pendente'?' <span class="tag warn">aguardando</span>':''}</td></tr>`).join('')}</tbody></table>`;
  const {data:au} = await SB.from('auditoria').select('em,usuario,tabela,registro_id,acao,antes,depois').order('em', {ascending:false}).limit(80);
  const nomeTab = Object.fromEntries(Object.entries(TBL).map(([c,t]) => [t, MODS[c] ? MODS[c].title : c === 'banco' ? 'Extrato bancário' : 'Pedidos'])); nomeTab.configuracoes = 'Configurações';
  const desc = d => d ? (d.descricao || d.desc || d.fornecedor || (d.os ? 'OS ' + d.os : '') || d.item || d.cliente || '') : '';
  const val = d => d && (d.valor ?? d.total);
  if ($('#audBox')) $('#audBox').innerHTML = `<table><thead><tr><th>Quando</th><th>Usuário</th><th>Ação</th><th>Módulo</th><th>Lançamento</th><th class="num">Valor</th></tr></thead><tbody>${(au||[]).map(a => { const d = a.depois || a.antes;
      return `<tr><td>${new Date(a.em).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</td><td>${esc(a.usuario||'—')}</td><td><span class="tag ${a.acao==='DELETE'?'bad':a.acao==='INSERT'?'good':'info'}">${{INSERT:'Incluiu',UPDATE:'Alterou',DELETE:'Excluiu'}[a.acao]}</span></td><td>${esc(nomeTab[a.tabela]||a.tabela)}</td><td>${esc(desc(d))}</td><td class="num">${val(d)!=null?money(val(d)):''}</td></tr>`; }).join('') || '<tr><td colspan="6" class="empty">Nenhuma alteração registrada.</td></tr>'}</tbody></table>`;
}
window.mudaPapel = async (id, papel) => {
  const {error} = await SB.from('perfis').update({papel}).eq('id', id);
  toast(error ? cloudErr(error) : 'Acesso atualizado.', !!error); cloudConfigLoad();
};

/* =====================================================================
   NAVEGAÇÃO
   ===================================================================== */
const NAV = [
  ['Painel', [['dashboard','📊','Dashboard']]],
  ['Receitas', [['receitas','💰','Vendas & Entradas'],['duplicatas','🧾','Duplicatas a Receber'],['cartao','💳','Cartões & Recebíveis']]],
  ['Despesas', [['pagar','📌','Contas a Pagar'],['compras','🧵','Compras de Insumos'],['logistica','🚚','Logística & Fretes']]],
  ['Tesouraria', [['conciliacao','🔄','Conciliação Bancária'],['extrato','🏦','Relatório de Pagamentos']]],
  ['Relatórios', [['dre','📈','DRE'],['fluxo','💧','Fluxo de Caixa'],['balancete','📒','Balancete'],['indicadores','🎯','Indicadores & Análises'],['historico','🗂','Histórico & Comparativo']]],
  ['Sistema', [['config','⚙️','Configurações & Backup']]]
];
function buildNav(){
  $('#nav').innerHTML = NAV.map(([sec, items]) => `<div class="nav-sec">${sec}</div>` + items.map(([id,ic,l]) => `<a data-v="${id}" class="${UI.view===id?'active':''}" onclick="go('${id}')"><span class="ic">${ic}</span><span class="lbl">${l}</span><span id="b_${id}"></span></a>`).join('')).join('');
  badges();
}
function badges(){
  const set = (id, n, cls='') => { const el = document.getElementById('b_'+id); if (el) el.outerHTML = `<span id="b_${id}">${n?`<span class="badge ${cls}">${n}</span>`:''}</span>`; };
  set('pagar', S.db.pagar.filter(r=>cpStatus(r)==='Vencido').length);
  set('duplicatas', S.db.duplicatas.filter(r=>dupSaldo(r)>0.01).length, 'amber');
}
window.go = v => { UI.view = v; persistUI(); document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active', a.dataset.v===v)); document.body.classList.remove('menu'); render(); window.scrollTo(0,0); };
function fillPeriod(){
  const ys = yearsAvailable(); if (!ys.includes(UI.year)) ys.push(UI.year);
  $('#selYear').innerHTML = ys.sort().map(y=>`<option value="${y}" ${y===UI.year?'selected':''}>${y}</option>`).join('');
  $('#selMonth').innerHTML = `<option value="0">Ano todo</option>` + MESES.map((m,i)=>`<option value="${i+1}" ${UI.month===i+1?'selected':''}>${m}</option>`).join('');
}
$('#selYear').onchange = e => { UI.year = +e.target.value; persistUI(); render(); };
$('#selMonth').onchange = e => { UI.month = +e.target.value; persistUI(); render(); };
$('#burger').onclick = () => document.body.classList.toggle('menu');
$('#scrim').onclick = () => document.body.classList.remove('menu');
$('#quickAdd').onclick = () => {
  openModal(`<div class="modal-h"><h3>O que você quer lançar?</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-b"><button class="btn primary full" style="height:52px;justify-content:flex-start" onclick="importarOS()">📄 Importar Ordem de Serviço (PDF) — lança sinal, cartão e duplicata</button>${MOD_KEYS.map(k=>`<button class="btn" style="height:48px;justify-content:flex-start" onclick="closeModal();go('${k}');setTimeout(()=>editRow('${k}'),30)">${MODS[k].icon} ${MODS[k].title}</button>`).join('')}</div>`);
};
function render(){
  killCharts();
  const v = UI.view;
  if (MODS[v]) renderModule(v);
  else ({dashboard:renderDashboard, dre:renderDRE, fluxo:renderFC, balancete:renderBalancete, indicadores:renderIndicadores, historico:renderHistorico, config:renderConfig, conciliacao:renderConciliacao}[v] || renderDashboard)();
  document.title = `${(NAV.flatMap(n=>n[1]).find(i=>i[0]===v)||[,,'Dashboard'])[2]} · Master Financeiro`;
}
$('#today').textContent = fdate(TODAY);
function startApp(){ applyPlano(); initPeriod(); fillPeriod(); buildNav(); savePill(); render(); }
if (ONLINE) cloudBoot(); else if (window.MASTER_CONFIG) gate('erro', 'O arquivo <b>config.js</b> ainda não foi preenchido com a <b>Project URL</b> e a <b>anon public key</b> do Supabase. Veja o passo a passo no README.'); else startApp();
window.closeModal = closeModal; window.confirmBox = confirmBox;

</script>
